<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>वास्तु उपाय</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1c12;
    --ink-soft:#5a4433;
    --paper:#f6ede0;
    --paper-2:#efe1cc;
    --line: #c9ad82;
    --saffron:#b5651d;
    --saffron-deep:#8a3d1e;
    --gold:#9c7a2e;
    --ok-bg:#eee3c8;
    --accent-a:#6b3f2a;
    --accent-b:#3f5d4a;
    --maroon:#6e1f1f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f1e6d3;
      --ink-soft:#cdb99a;
      --paper:#20140d;
      --paper-2:#2b1c12;
      --line:#5a4126;
      --saffron:#e08a3e;
      --saffron-deep:#e6a15c;
      --gold:#d4b25c;
      --ok-bg:#3a2a17;
      --accent-a:#e0b48a;
      --accent-b:#8fbf9f;
      --maroon:#c96b6b;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f1e6d3;
    --ink-soft:#cdb99a;
    --paper:#20140d;
    --paper-2:#2b1c12;
    --line:#5a4126;
    --saffron:#e08a3e;
    --saffron-deep:#e6a15c;
    --gold:#d4b25c;
    --ok-bg:#3a2a17;
    --accent-a:#e0b48a;
    --accent-b:#8fbf9f;
    --maroon:#c96b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Devanagari','Noto Sans',sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  header{
    text-align:center;
    margin-bottom:34px;
    position:relative;
  }
  .lang-toggle{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:16px;
  }
  .lang-btn{
    padding:6px 16px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:14px;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:.82rem;
    cursor:pointer;
  }
  .lang-btn.active{
    background:var(--saffron);
    border-color:var(--saffron);
    color:#fff8ef;
    font-weight:600;
  }
  .yantra{
    width:56px;height:56px;margin:0 auto 10px;
    border:2px solid var(--saffron);
    transform:rotate(45deg);
    position:relative;
  }
  .yantra::after{
    content:"";
    position:absolute;inset:8px;
    border:2px solid var(--gold);
  }
  h1{
    font-family:'Rozha One', serif;
    font-size:2.5rem;
    margin:0 0 6px;
    color:var(--saffron-deep);
    letter-spacing:.5px;
  }
  header p{
    color:var(--ink-soft);
    font-size:1rem;
    max-width:560px;
    margin:0 auto;
  }
  .panel{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:26px 24px;
    margin-bottom:30px;
  }
  .panel h2{
    font-size:1.05rem;
    margin:0 0 18px;
    color:var(--saffron-deep);
    font-weight:600;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media (max-width:640px){ .grid{grid-template-columns:1fr;} }
  label{
    display:block;
    font-size:.88rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  select{
    width:100%;
    padding:11px 12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--ink);
    font-family:inherit;
    font-size:1rem;
    appearance:none;
  }
  .toggle-row{
    display:flex;
    gap:10px;
  }
  .toggle-btn{
    flex:1;
    padding:11px 12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:1rem;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .toggle-btn.active{
    background:var(--saffron);
    border-color:var(--saffron);
    color:#fff8ef;
    font-weight:600;
  }
  .full{grid-column:1 / -1;}
  .go-btn{
    margin-top:22px;
    width:100%;
    padding:13px;
    background:var(--maroon);
    color:#fdf3e4;
    border:none;
    border-radius:3px;
    font-family:inherit;
    font-size:1.05rem;
    font-weight:600;
    cursor:pointer;
    letter-spacing:.3px;
  }
  .go-btn:hover{ filter:brightness(1.08); }
  #result{ min-height:20px; }
  .rule-banner{
    font-size:.9rem;
    color:var(--ink-soft);
    background:var(--ok-bg);
    border-left:3px solid var(--gold);
    padding:10px 14px;
    margin-bottom:20px;
    border-radius:2px;
  }
  .rule-banner b{ color:var(--saffron-deep); }
  .group-title{
    font-size:.92rem;
    text-transform:none;
    color:var(--accent-b);
    font-weight:600;
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-title::before{
    content:"";
    width:6px;height:6px;
    background:var(--accent-b);
    border-radius:50%;
    display:inline-block;
  }
  .devata-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:12px;
  }
  .card{
    border:1px solid var(--line);
    background:var(--paper-2);
    border-radius:3px;
    padding:14px 16px;
  }
  .card .name{
    font-weight:700;
    font-size:1.05rem;
    color:var(--saffron-deep);
    margin-bottom:4px;
  }
  .card .dir{
    display:inline-block;
    font-size:.75rem;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:1px 8px;
    border-radius:10px;
    margin-bottom:8px;
  }
  .card .kary{
    font-size:.92rem;
    color:var(--ink);
  }
  .card .kary.tbd{
    color:var(--ink-soft);
    font-style:italic;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:30px 10px;
    font-size:.95rem;
  }
  .samasya-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:10px;
    margin-bottom:24px;
  }
  .samasya-btn{
    text-align:left;
    padding:13px 16px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--ink);
    font-family:inherit;
    font-size:.95rem;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .samasya-btn:hover{ border-color:var(--saffron); }
  .samasya-btn.active{
    background:var(--saffron);
    border-color:var(--saffron);
    color:#fff8ef;
    font-weight:600;
  }
  .remedy-card{
    border:1px solid var(--gold);
    background:var(--ok-bg);
    border-radius:4px;
    padding:22px 24px;
    margin-top:6px;
  }
  .remedy-name{
    font-family:'Rozha One', serif;
    font-size:1.6rem;
    color:var(--saffron-deep);
    margin-bottom:14px;
  }
  .remedy-row{
    display:flex;
    gap:14px;
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:.95rem;
  }
  .remedy-row:first-of-type{ border-top:none; }
  .remedy-label{
    min-width:130px;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .upay-block{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .upay-title{
    font-size:.88rem;
    font-weight:600;
    color:var(--saffron-deep);
    margin-bottom:8px;
  }
  .upay-text{
    margin:0;
    font-size:.92rem;
    color:var(--ink);
    line-height:1.7;
  }
  .upay-text.upay-note{
    margin-top:10px;
    font-size:.85rem;
    color:var(--ink-soft);
    font-style:italic;
  }
  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:.78rem;
    margin-top:40px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="lang-toggle">
      <button type="button" class="lang-btn active" data-lang="hi" id="langHi">हिंदी</button>
      <button type="button" class="lang-btn" data-lang="en" id="langEn">English</button>
    </div>
    <div class="yantra"></div>
    <h1 id="appTitle">वास्तु उपाय</h1>
    <p id="appSubtitle">दशा स्वामी, उदित/त्रिक (UT/T) एवं नक्षत्र स्वामी के आधार पर अपनी समस्या चुनें और संबंधित देवता को प्रसन्न करने का उपाय जानें</p>
  </header>

  <div class="panel">
    <h2 id="inputHeading">इनपुट दें</h2>
    <div class="grid">
      <div>
        <label id="dashaLordLabel" for="dashaLord">दशा स्वामी (Dasha Lord)</label>
        <select id="dashaLord"></select>
      </div>
      <div>
        <label id="nlLabel" for="nl">नक्षत्र स्वामी (NL)</label>
        <select id="nl"></select>
      </div>
      <div class="full">
        <label id="statusLabel">दशा स्वामी की स्थिति</label>
        <div class="toggle-row">
          <button type="button" class="toggle-btn active" data-val="UT" id="btnUT">उदित (UT)</button>
          <button type="button" class="toggle-btn" data-val="T" id="btnT">त्रिक (T)</button>
        </div>
      </div>
    </div>
    <button class="go-btn" id="goBtn">परिणाम देखें</button>
  </div>

  <div id="result"></div>

  <footer id="appFooter">Vastu Purusha Mandala · 45 पद देवता प्रणाली — विश्वकर्मा प्रकाश एवं वृहत्संहिता आधारित</footer>
</div>

function dirText(dir, lang){
  if(lang === "hi") return dir;
  const map = {
    "पूर्व (E)":"East", "उत्तर (N)":"North", "पश्चिम (W)":"West",
    "दक्षिण (S)":"South", "मध्य (केंद्र)":"Center"
  };
  return map[dir] || dir;
}

function karyText(kary, lang){
  if(!kary) return null;
  const m = kary.match(/^(.*?)\s*\((.*)\)\s*$/);
  if(!m) return kary;
  return lang === "hi" ? m[1].trim() : m[2].trim();
}

function nameText(d, lang){ return lang === "hi" ? d.name : d.name_en; }
function bhogText(d, lang){ return lang === "hi" ? d.bhog : d.bhog_en; }
function ayudhText(d, lang){ return lang === "hi" ? d.ayudh : d.ayudh_en; }

function applyStaticText(){
  const t = TXT[currentLang];
  document.title = t.title;
  document.getElementById("appTitle").textContent = t.title;
  document.getElementById("appSubtitle").textContent = t.subtitle;
  document.getElementById("inputHeading").textContent = t.inputHeading;
  document.getElementById("dashaLordLabel").textContent = t.dashaLordLabel;
  document.getElementById("nlLabel").textContent = t.nlLabel;
  document.getElementById("statusLabel").textContent = t.statusLabel;
  document.getElementById("btnUT").textContent = t.utBtn;
  document.getElementById("btnT").textContent = t.tBtn;
  document.getElementById("goBtn").textContent = t.goBtn;
  document.getElementById("appFooter").textContent = t.footer;
}

function populateSelects(){
  ["dashaLord","nl"].forEach(id=>{
    const sel = document.getElementById(id);
    sel.innerHTML = PLANETS.map(p=>`<option value="${p}">${p}</option>`).join("");
  });
}

function devataFor(planet){
  return DEVATA.filter(d=>d.planet===planet);
}

function samasyaBtnHtml(d){
  const t = TXT[currentLang];
  const label = karyText(d.kary, currentLang) || t.otherLabel;
  const activeCls = String(d.id) === String(selectedId) ? " active" : "";
  return `<button type="button" class="samasya-btn${activeCls}" data-id="${d.id}">${label}</button>`;
}

function remedyCardHtml(d){
  const t = TXT[currentLang];
  const bhog = bhogText(d, currentLang) || t.pendingText;
  const mantra = d.mantra ? d.mantra : t.pendingText;
  const ayudh = ayudhText(d, currentLang) || t.pendingText;
  const upayText = t.upayText(nameText(d, currentLang), dirText(d.dir, currentLang));
  return `<div class="remedy-card">
    <div class="remedy-name">${nameText(d, currentLang)}</div>
    <div class="remedy-row"><span class="remedy-label">${t.dirLabel}</span><span>${dirText(d.dir, currentLang)}</span></div>
    <div class="remedy-row"><span class="remedy-label">${t.bhogLabel}</span><span>${bhog}</span></div>
    <div class="remedy-row"><span class="remedy-label">${t.mantraLabel}</span><span>${mantra}</span></div>
    <div class="remedy-row"><span class="remedy-label">${t.ayudhLabel}</span><span>${ayudh}</span></div>
    <div class="upay-block">

      <p class="upay-text">${upayText}</p>
    </div>

}

function renderResult(){
  const result = document.getElementById("result");
  if(!lastInputs){ result.innerHTML = ""; return; }

  const {dashaLord, nl, statusVal} = lastInputs;

  let bannerText = "";
  let pool = [];

  if(statusVal === "UT"){
    bannerText = t.bannerUT(dashaLord, nl);
    pool = [...devataFor(dashaLord), ...devataFor(nl)];
  } else {
    bannerText = t.bannerT(nl);
    pool = [...devataFor(nl)];
  }

  activePool = pool;

  if(!pool.length){
    result.innerHTML = `<div class="rule-banner">${bannerText}</div><div class="empty">${t.emptyMsg}</div>`;
    return;
  }

  const samasyaListHtml = pool.map(samasyaBtnHtml).join("");
  const selected = activePool.find(x=>String(x.id)===String(selectedId));
  result.innerHTML = `
    <div class="rule-banner">${bannerText}</div>
    <div class="group-title">${t.chooseSamasya}</div>
    <div class="samasya-grid">${samasyaListHtml}</div>
    <div id="remedyBox">${selected ? remedyCardHtml(selected) : ""}</div>
  `;

  document.querySelectorAll(".samasya-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      selectedId = btn.dataset.id;
      renderResult();
    });
  });
}
</script>
</body>
</html>
