<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watch Prashna</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Noto Sans Devanagari', Tahoma, sans-serif;
    background:
      radial-gradient(circle at 15% 85%, rgba(214,150,60,0.18), transparent 55%),
      radial-gradient(circle at 85% 10%, rgba(140,60,60,0.22), transparent 50%),
      linear-gradient(160deg, #2b0f14 0%, #3a1418 35%, #2a0d10 70%, #1c0a0c 100%);
    min-height: 100vh;
    color: #f3e6d8;
    padding: 24px 14px 60px;
  }
  #root { max-width: 760px; margin: 0 auto; }
</style>
</head>
<body>
<div id="root">
  <div style="text-align:center; padding:40px 16px; color:#e8c9a0; font-family:sans-serif;">
    Loading Watch Prashna… (if this stays here more than a few seconds, your network may be blocking the CDN scripts this app needs)
  </div>
</div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useCallback, useEffect } = React;

const RASHI_NAMES = ['Mesh','Vrishabh','Mithun','Kark','Simha','Kanya','Tula','Vrishchik','Dhanu','Makar','Kumbh','Meen'];
const RASHI_HINDI = ['मेष','वृषभ','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन'];

function pad2(n){ return n.toString().padStart(2,'0'); }

function formatDateInput(raw){
  let digits = raw.replace(/\D/g,'').slice(0,8);
  if(digits.length >= 5) return digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
  if(digits.length >= 3) return digits.slice(0,2)+'/'+digits.slice(2);
  return digits;
}

function todayDDMMYYYY(){
  const d = new Date();
  return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();
}

function laganRashiFromHour(hour12){
  // hour12: 1..12, hour-hand number on the watch
  const h = hour12 % 12; // 12 -> 0
  return h + 1;
}

function moonRashiFromMinute(minute){
  // minute: 0..59
  return Math.min(12, Math.floor(minute/5) + 1);
}

const AXIS_RESULTS = {
  '1-1':  { result: 'Strong Yes',              hindi: 'हाँ, प्रबल संभावना है',        tone: 'yes'   },
  '2-12': { result: 'Strong No',               hindi: 'नहीं, स्पष्ट इनकार',            tone: 'no'    },
  '3-11': { result: 'Strong Yes',              hindi: 'हाँ, प्रबल संभावना है',        tone: 'yes'   },
  '4-10': { result: 'Hard Luck, Result 50-50', hindi: 'भाग्य साथ नहीं, परिणाम 50-50', tone: 'mixed' },
  '5-9':  { result: 'Strong Yes',              hindi: 'हाँ, प्रबल संभावना है',        tone: 'yes'   },
  '6-8':  { result: 'Strong No',               hindi: 'नहीं, स्पष्ट इनकार',            tone: 'no'    },
  '7-7':  { result: 'Tension and Delay',       hindi: 'तनाव और विलंब',                tone: 'mixed' },
};

function computeAxis(lagan, moon){
  const d = ((moon - lagan) % 12 + 12) % 12; // 0..11, forward steps from Lagan to Moon
  let forward, backward;
  if(d === 0){ forward = 1; backward = 1; }
  else { forward = d + 1; backward = 13 - d; }
  const lo = Math.min(forward, backward);
  const hi = Math.max(forward, backward);
  const key = lo + '-' + hi;
  const info = AXIS_RESULTS[key] || { result: '-', hindi: '-', tone: 'mixed' };
  return { forward, backward, label: lo === hi ? (lo + ' to ' + hi) : (lo + ' to ' + hi), lo, hi, ...info };
}

const TONE_COLORS = {
  yes:   { bg: 'linear-gradient(135deg,#2f6b3e,#1f4b2a)', border: '#4c9a5c' },
  no:    { bg: 'linear-gradient(135deg,#7a2626,#4f1414)', border: '#b34a4a' },
  mixed: { bg: 'linear-gradient(135deg,#8a5a17,#5c3a0e)', border: '#d99a3a' },
};

// ---------- Interactive Clock ----------
function WatchClock({ hour, minute, onChange, interactive }){
  const svgRef = useRef(null);
  const [dragging, setDragging] = useState(null); // 'hour' | 'minute' | null

  const size = 260;
  const cx = size/2, cy = size/2, R = size/2 - 18;

  const minuteDeg = minute * 6;
  const hourDeg = (hour % 12) * 30;

  const toXY = (deg, len) => {
    const rad = (deg - 90) * Math.PI/180;
    return [ cx + len*Math.cos(rad), cy + len*Math.sin(rad) ];
  };

  const angleFromEvent = useCallback((clientX, clientY) => {
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = size/rect.width, scaleY = size/rect.height;
    const x = (clientX - rect.left) * scaleX - cx;
    const y = (clientY - rect.top) * scaleY - cy;
    let deg = Math.atan2(x, -y) * 180/Math.PI;
    if(deg < 0) deg += 360;
    return deg;
  }, []);

  const handleMove = useCallback((clientX, clientY) => {
    if(!dragging) return;
    const deg = angleFromEvent(clientX, clientY);
    if(dragging === 'minute'){
      let m = Math.round(deg/6) % 60;
      if(m < 0) m += 60;
      onChange({ minute: m });
    } else if(dragging === 'hour'){
      let h = Math.round(deg/30) % 12;
      if(h === 0) h = 12;
      onChange({ hour: h });
    }
  }, [dragging, angleFromEvent, onChange]);

  useEffect(() => {
    if(!dragging) return;
    const onMove = (e) => {
      const p = e.touches ? e.touches[0] : e;
      handleMove(p.clientX, p.clientY);
    };
    const onUp = () => setDragging(null);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive:false });
    window.addEventListener('touchend', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
    };
  }, [dragging, handleMove]);

  const [hx, hy] = toXY(hourDeg, R*0.5);
  const [mx, my] = toXY(minuteDeg, R*0.78);
  const [hHandleX, hHandleY] = toXY(hourDeg, R*0.5);
  const [mHandleX, mHandleY] = toXY(minuteDeg, R*0.78);

  const laganNum = laganRashiFromHour(hour);
  const moonNum = moonRashiFromMinute(minute);

  return (
    <svg
      ref={svgRef}
      viewBox={`0 0 ${size} ${size}`}
      width="100%"
      style={{ maxWidth: 260, display:'block', margin: '0 auto', touchAction: 'none' }}
      onMouseDown={(e)=>e.preventDefault()}
    >
      <circle cx={cx} cy={cy} r={R} fill="#fdf6ec" stroke="#5c2a1a" strokeWidth="4" />
      <circle cx={cx} cy={cy} r={R-10} fill="none" stroke="#c9a25a" strokeWidth="1" opacity="0.5" />
      {Array.from({length:12}).map((_,i)=>{
        const num = i+1;
        const deg = num*30;
        const [tx,ty] = toXY(deg, R-24);
        const isLagan = num === laganNum;
        const isMoon = num === moonNum;
        return (
          <text key={num} x={tx} y={ty+6} textAnchor="middle"
            fontSize={isLagan||isMoon ? 20 : 16}
            fontWeight={isLagan||isMoon ? 800 : 600}
            fill={isLagan ? '#a6591c' : isMoon ? '#2f6b3e' : '#3a1a12'}>
            {num}
          </text>
        );
      })}
      {Array.from({length:60}).map((_,i)=>{
        const deg = i*6;
        const isHour = i%5===0;
        const [x1,y1] = toXY(deg, R-4);
        const [x2,y2] = toXY(deg, isHour ? R-12 : R-8);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#5c2a1a" strokeWidth={isHour?2:1} opacity={isHour?0.8:0.35}/>;
      })}
      {/* hour hand */}
      <line x1={cx} y1={cy} x2={hx} y2={hy} stroke="#a6591c" strokeWidth="6" strokeLinecap="round" />
      {/* minute hand */}
      <line x1={cx} y1={cy} x2={mx} y2={my} stroke="#2f6b3e" strokeWidth="4" strokeLinecap="round" />
      <circle cx={cx} cy={cy} r="6" fill="#3a1a12" />
      {interactive && (
        <>
          <circle
            cx={hHandleX} cy={hHandleY} r="12" fill="#a6591c" opacity={dragging==='hour' ? 0.9 : 0.55}
            style={{ cursor:'grab' }}
            onMouseDown={()=>setDragging('hour')}
            onTouchStart={()=>setDragging('hour')}
          />
          <circle
            cx={mHandleX} cy={mHandleY} r="10" fill="#2f6b3e" opacity={dragging==='minute' ? 0.9 : 0.55}
            style={{ cursor:'grab' }}
            onMouseDown={()=>setDragging('minute')}
            onTouchStart={()=>setDragging('minute')}
          />
        </>
      )}
    </svg>
  );
}

function App(){
  const [question, setQuestion] = useState('');
  const [date, setDate] = useState(todayDDMMYYYY());
  const [hour, setHour] = useState(() => { const h=new Date().getHours()%12; return h===0?12:h; });
  const [minute, setMinute] = useState(() => new Date().getMinutes());
  const [isPM, setIsPM] = useState(() => new Date().getHours() >= 12);
  const [manualMode, setManualMode] = useState(false);
  const [result, setResult] = useState(null);

  const hourStr = hour.toString();
  const minuteStr = pad2(minute);

  const useCurrentTime = () => {
    const d = new Date();
    setDate(pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear());
    const h = d.getHours()%12;
    setHour(h===0?12:h);
    setMinute(d.getMinutes());
    setIsPM(d.getHours()>=12);
  };

  const reset = () => {
    setResult(null);
    setManualMode(false);
    setQuestion('');
    useCurrentTime();
  };

  const cast = () => {
    const lagan = laganRashiFromHour(hour);
    const moon = moonRashiFromMinute(minute);
    const axis = computeAxis(lagan, moon);
    setResult({ lagan, moon, axis, hour, minute, date, question });
  };

  const onClockChange = (patch) => {
    if(patch.hour !== undefined) setHour(patch.hour);
    if(patch.minute !== undefined) setMinute(patch.minute);
  };

  const handleHourInput = (v) => {
    const digits = v.replace(/\D/g,'').slice(0,2);
    if(digits === '') { setHour(''); return; }
    let n = parseInt(digits,10);
    if(n > 12) n = 12;
    setHour(n);
  };
  const handleMinuteInput = (v) => {
    const digits = v.replace(/\D/g,'').slice(0,2);
    if(digits === '') { setMinute(''); return; }
    let n = parseInt(digits,10);
    if(n > 59) n = 59;
    setMinute(n);
  };

  const validHour = typeof hour === 'number' && hour>=1 && hour<=12;
  const validMinute = typeof minute === 'number' && minute>=0 && minute<=59;
  const canCast = validHour && validMinute && date.length === 10;

  const previewHour = validHour ? hour : 12;
  const previewMinute = validMinute ? minute : 0;

  return (
    <div>
      <div style={{textAlign:'center', marginBottom: 22}}>
        <div style={{fontSize: 30, fontWeight: 800, color:'#f3e6d8', letterSpacing: 0.5}}>Watch Prashna</div>
        <div style={{fontSize: 14, color:'#d9b98f', marginTop: 4}}>घड़ी आधारित प्रश्न शास्त्र — Hour &amp; Minute Hand Method</div>
      </div>

      <div style={cardStyle}>
        <label style={labelStyle}>Your Question / आपका प्रश्न</label>
        <textarea
          value={question}
          onChange={(e)=>setQuestion(e.target.value)}
          placeholder="अपना प्रश्न यहाँ लिखें..."
          rows={3}
          style={{...inputStyle, resize:'vertical', fontFamily:'inherit', marginBottom: 14}}
        />

        <label style={labelStyle}>Date (DD/MM/YYYY)</label>
        <input
          value={date}
          onChange={(e)=>setDate(formatDateInput(e.target.value))}
          placeholder="DD/MM/YYYY"
          style={inputStyle}
        />

        <div style={{display:'flex', gap: 10, marginTop: 14, alignItems:'flex-end', flexWrap:'wrap'}}>
          <div style={{flex:'1 1 90px'}}>
            <label style={labelStyle}>Hour (1-12)</label>
            <input
              value={hourStr}
              onChange={(e)=>handleHourInput(e.target.value)}
              style={inputStyle}
              inputMode="numeric"
            />
          </div>
          <div style={{flex:'1 1 90px'}}>
            <label style={labelStyle}>Minute (00-59)</label>
            <input
              value={minuteStr}
              onChange={(e)=>handleMinuteInput(e.target.value)}
              style={inputStyle}
              inputMode="numeric"
            />
          </div>
          <button onClick={()=>setIsPM(p=>!p)} style={toggleBtnStyle}>{isPM ? 'PM' : 'AM'}</button>
          <button onClick={useCurrentTime} style={secondaryBtnStyle}>Use current time</button>
        </div>
        <div style={{fontSize: 12, color:'#c9a984', marginTop: 6}}>
          Note: AM/PM is for your record only — the calculation uses only where the hands point (1-12 / 0-59), as per the watch method.
        </div>

        <div style={{marginTop: 16}}>
          <button onClick={()=>setManualMode(m=>!m)} style={secondaryBtnStyle}>
            {manualMode ? 'Hide manual clock' : 'Set time manually on clock'}
          </button>
        </div>

        {manualMode && (
          <div style={{marginTop: 16}}>
            <WatchClock hour={previewHour} minute={previewMinute} onChange={onClockChange} interactive={true} />
            <div style={{textAlign:'center', fontSize: 13, color:'#d9b98f', marginTop: 8}}>
              Drag the copper hour hand or the green minute hand to set the time.
            </div>
          </div>
        )}

        <div style={{display:'flex', gap: 10, marginTop: 20}}>
          <button onClick={cast} disabled={!canCast} style={{...primaryBtnStyle, opacity: canCast?1:0.5, cursor: canCast?'pointer':'not-allowed'}}>
            Cast the Prashna
          </button>
          <button onClick={reset} style={secondaryBtnStyle}>Reset</button>
        </div>
      </div>

      {result && (
        <div style={{...cardStyle, marginTop: 20}}>
          {result.question && result.question.trim() && (
            <div style={{
              textAlign:'center', marginBottom: 14, fontSize:15, color:'#fdf6ec', fontWeight:600,
              background:'rgba(253,246,236,0.06)', border:'1px solid rgba(217,185,143,0.25)',
              borderRadius: 12, padding:'10px 14px'
            }}>
              &ldquo;{result.question}&rdquo;
            </div>
          )}
          <div style={{textAlign:'center', marginBottom: 14, fontSize:14, color:'#d9b98f'}}>
            {result.date} &nbsp;•&nbsp; {result.hour}:{pad2(result.minute)} {isPM ? 'PM':'AM'}
          </div>

          <WatchClock hour={result.hour} minute={result.minute} onChange={()=>{}} interactive={false} />

          <div style={{display:'flex', gap: 12, marginTop: 20, flexWrap:'wrap'}}>
            <div style={pillStyle}>
              <div style={pillLabel}>Lagan Rashi</div>
              <div style={pillValue}>{result.lagan}. {RASHI_NAMES[result.lagan-1]}</div>
              <div style={pillSub}>{RASHI_HINDI[result.lagan-1]}</div>
            </div>
            <div style={pillStyle}>
              <div style={pillLabel}>Moon Rashi</div>
              <div style={pillValue}>{result.moon}. {RASHI_NAMES[result.moon-1]}</div>
              <div style={pillSub}>{RASHI_HINDI[result.moon-1]}</div>
            </div>
            <div style={pillStyle}>
              <div style={pillLabel}>Axis Relation</div>
              <div style={pillValue}>{result.axis.label}</div>
              <div style={pillSub}>{result.axis.forward} fwd / {result.axis.backward} bwd</div>
            </div>
          </div>

          <div style={{
            marginTop: 20,
            padding: '18px 16px',
            borderRadius: 14,
            textAlign: 'center',
            background: TONE_COLORS[result.axis.tone].bg,
            border: `1px solid ${TONE_COLORS[result.axis.tone].border}`,
          }}>
            <div style={{fontSize: 22, fontWeight: 800, color:'#fdf6ec'}}>{result.axis.result}</div>
            <div style={{fontSize: 16, color:'#f3e6d8', marginTop: 6}}>{result.axis.hindi}</div>
          </div>
        </div>
      )}
    </div>
  );
}

const cardStyle = {
  background: 'linear-gradient(160deg, rgba(253,246,236,0.06), rgba(253,246,236,0.02))',
  border: '1px solid rgba(217,185,143,0.25)',
  borderRadius: 18,
  padding: '22px 20px',
  boxShadow: '0 10px 30px rgba(0,0,0,0.25)',
};
const labelStyle = { display:'block', fontSize: 12, color:'#d9b98f', marginBottom: 6, fontWeight:600, letterSpacing:0.3 };
const inputStyle = {
  width: '100%', padding: '10px 12px', borderRadius: 10, border: '1px solid rgba(217,185,143,0.4)',
  background: 'rgba(253,246,236,0.08)', color: '#fdf6ec', fontSize: 15, outline: 'none',
};
const primaryBtnStyle = {
  flex: 1, padding: '12px 16px', borderRadius: 12, border: 'none',
  background: 'linear-gradient(135deg,#c17a2e,#8c4715)', color:'#fdf6ec', fontWeight: 700, fontSize: 15,
};
const secondaryBtnStyle = {
  padding: '10px 14px', borderRadius: 12, border: '1px solid rgba(217,185,143,0.4)',
  background: 'rgba(253,246,236,0.06)', color:'#f3e6d8', fontWeight: 600, fontSize: 13, cursor:'pointer',
};
const toggleBtnStyle = {
  padding: '10px 14px', borderRadius: 12, border: '1px solid rgba(217,185,143,0.4)',
  background: 'rgba(166,89,28,0.35)', color:'#fdf6ec', fontWeight: 700, fontSize: 14, cursor:'pointer',
};
const pillStyle = {
  flex: '1 1 150px', background: 'rgba(253,246,236,0.06)', border: '1px solid rgba(217,185,143,0.25)',
  borderRadius: 14, padding: '12px 14px', textAlign:'center',
};
const pillLabel = { fontSize: 11, color:'#c9a984', textTransform:'uppercase', letterSpacing: 0.5, fontWeight:700 };
const pillValue = { fontSize: 17, color:'#fdf6ec', fontWeight: 800, marginTop: 4 };
const pillSub = { fontSize: 12, color:'#d9b98f', marginTop: 2 };

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="hub-nav.js"></script>
</body>
</html>
