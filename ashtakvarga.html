<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astro Vastu Ashtakavarga</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fa;--ink:#1a2040;--mut:#5b6385;--card:#fff;--line:#d5daea;--acc:#b85f00;--hi:#e8ecfa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152b;--ink:#e8ebf8;--mut:#9aa3c7;--card:#1b1f3b;--line:#2d3358;--acc:#f0a53a;--hi:#262b52}}
:root[data-theme="dark"]{--bg:#12152b;--ink:#e8ebf8;--mut:#9aa3c7;--card:#1b1f3b;--line:#2d3358;--acc:#f0a53a;--hi:#262b52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Mukta',system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:800;margin:28px 0 8px}
p.sub{margin:0 0 18px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
:root[data-theme="dark"] button{color:#12152b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#12152b}}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;text-align:center}
th,td{padding:7px 6px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:600;background:var(--hi)}
td:first-child,th:first-child{text-align:left;white-space:nowrap}
.lg{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.sav td{font-weight:800}
.tot{font-weight:800;background:var(--hi)}
.note{color:var(--mut);font-size:.85rem;margin-top:8px}
#out{display:none}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:12px}
details.acc>summary{cursor:pointer;padding:14px 16px;font-weight:800;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'+';color:var(--acc);font-size:1.4rem;line-height:1}
details.acc[open]>summary::after{content:'\2212'}
details.acc>summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}
details.acc>.in{padding:0 16px 16px;overflow-x:auto}
h3{font-size:1rem;font-weight:800;margin:18px 0 8px}
h3:first-child{margin-top:4px}
:root button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.who{font-weight:800;font-size:1.15rem;margin:22px 0 0}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.lang button{padding:6px 12px}
:root button.sec.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
</style>
</head>
<body>
<main>
<div class="lang"><button type="button" id="le" class="sec">English</button><button type="button" id="lh" class="sec">हिन्दी</button></div>
<h1 data-i="h1"></h1>
<p class="sub" data-i="sub"></p>
<div class="box">
<div id="savedProfileWrap" style="display:none;margin-bottom:14px;">
<label style="display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:4px;">Saved Birth Profile <span style="color:var(--mut);font-weight:400;">(Astro Master Hub)</span></label>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
<select id="savedProfileSelect" style="flex:1;min-width:180px;"></select>
<button type="button" id="manageProfilesBtn" class="sec" style="white-space:nowrap;">👤 प्रोफाइल मैनेज करें</button>
</div>
<p class="note" id="profileAppliedNote" style="display:none;margin-top:6px;"></p>
</div>
<form id="f">
<label><span data-i="name"></span><input type="text" id="nm" maxlength="60" autocomplete="name" placeholder="Name"></label>
<label><span data-i="bdate"></span><input type="text" id="d" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" pattern="\d{1,2}[/.-]\d{1,2}[/.-]\d{4}" title="dd/mm/yyyy" required></label>
<label><span data-i="btime"></span><input type="time" id="t" required></label>
<label><span data-i="co"></span><select id="co"></select></label>
<label><span data-i="st"></span><select id="st"></select></label>
<label><span data-i="ci"></span><select id="ci"></select></label>
<label><span data-i="tz"></span><input type="number" id="z" step="0.25"></label>
<label><span data-i="la"></span><input type="number" id="la" step="0.0001"></label>
<label><span data-i="lo"></span><input type="number" id="lo" step="0.0001"></label>
<button type="submit" data-i="gen"></button>
<button type="button" id="rs" class="sec" data-i="rst"></button>
</form>
<p class="note" data-i="fnote"></p>
</div>

<div id="out">
<p class="who" id="who"></p>
<details class="acc"><summary data-i="s1"></summary><div class="in"><table id="pos"></table>
<p class="note" data-i="pnote"></p></div></details>
<details class="acc"><summary data-i="s2"></summary><div class="in"><p class="note" id="chk" style="margin:0 0 8px"></p><table id="bav"></table></div></details>
<details class="acc"><summary data-i="s3"></summary><div class="in"><table id="tri"></table></div></details>
<details class="acc"><summary data-i="s4"></summary><div class="in"><h3 data-i="h3a"></h3><table id="vd"></table>
<p class="note" data-i="vnote"></p>
<h3 data-i="h3b"></h3><table id="vr"></table></div></details>
</div>
</main>
<!-- Astro Master Hub: shared saved-birth-profile engine (same folder as birth-profile.html) -->
<script src="birth-profile.js"></script>
<script>
const RN=[['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'],['मेष','वृषभ','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन']];let R=RN[0];
const PL=[['Sun','Moon','Mars','Merc','Jup','Ven','Sat','ASC'],['सूर्य','चंद्र','मंगल','बुध','गुरु','शुक्र','शनि','लग्न']];let P=PL[0];
// T[target][contributor: सू,चं,मं,बु,गु,शु,श,ल] = शुभ स्थान (योगदानकर्ता से गिनकर)
const T=[
[[1,2,4,7,8,9,10,11],[3,6,10,11],[1,2,4,7,8,9,10,11],[3,5,6,9,10,11,12],[5,6,9,11],[6,7,12],[1,2,4,7,8,9,10,11],[3,4,6,10,11,12]],
[[3,6,7,8,10,11],[1,3,6,7,10,11],[2,3,5,6,9,10,11],[1,3,4,5,7,8,10,11],[1,4,7,8,10,11,12],[3,4,5,7,9,10,11],[3,5,6,11],[3,6,10,11]],
[[3,5,6,10,11],[3,6,11],[1,2,4,7,8,10,11],[3,5,6,11],[6,10,11,12],[6,8,11,12],[1,4,7,8,9,10,11],[1,3,6,10,11]],
[[5,6,9,11,12],[2,4,6,8,10,11],[1,2,4,7,8,9,10,11],[1,3,5,6,9,10,11,12],[6,8,11,12],[1,2,3,4,5,8,9,11],[1,2,4,7,8,9,10,11],[1,2,4,6,8,10,11]],
[[1,2,3,4,7,8,9,10,11],[2,5,7,9,11],[1,2,4,7,8,10,11],[1,2,4,5,6,9,10,11],[1,2,3,4,7,8,10,11],[2,5,6,9,10,11],[3,5,6,12],[1,2,4,5,6,7,9,10,11]],
[[8,11,12],[1,2,3,4,5,8,9,11,12],[3,5,6,9,11,12],[3,5,6,9,11],[5,8,9,10,11],[1,2,3,4,5,8,9,10,11],[3,4,5,8,9,10,11],[1,2,3,4,5,8,9,11]],
[[1,2,4,7,8,10,11],[3,6,11],[3,5,6,10,11,12],[6,8,9,10,11,12],[5,6,11,12],[6,11,12],[3,5,6,11],[1,3,4,6,10,11]],
[[3,4,6,10,11,12],[3,6,10,11,12],[1,3,6,10,11],[1,2,4,6,8,10,11],[1,2,4,5,6,7,9,10,11],[1,2,3,4,5,8,9],[1,3,4,6,10,11],[3,6,10,11]]
];
const rad=Math.PI/180,nm=x=>((x%360)+360)%360,S=x=>Math.sin(x*rad),C=x=>Math.cos(x*rad);
function jd(y,m,d,h){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+h/24}
const EL={
mo:d=>[125.1228-.0529538083*d,5.1454,318.0634+.1643573223*d,60.2666,.0549,115.3654+13.0649929509*d],
me:d=>[48.3313+3.24587e-5*d,7.0047+5e-8*d,29.1241+1.01444e-5*d,.387098,.205635+5.59e-10*d,168.6562+4.0923344368*d],
ve:d=>[76.6799+2.4659e-5*d,3.3946+2.75e-8*d,54.891+1.38374e-5*d,.72333,.006773-1.302e-9*d,48.0052+1.6021302244*d],
ma:d=>[49.5574+2.11081e-5*d,1.8497-1.78e-8*d,286.5016+2.92961e-5*d,1.523688,.093405+2.516e-9*d,18.6021+.5240207766*d],
ju:d=>[100.4542+2.76854e-5*d,1.303-1.557e-7*d,273.8777+1.64505e-5*d,5.20256,.048498+4.469e-9*d,19.895+.0830853001*d],
sa:d=>[113.6634+2.3898e-5*d,2.4886-1.081e-7*d,339.3939+2.97661e-5*d,9.55475,.055546-9.499e-9*d,316.967+.0334442282*d]};
function kep(q){let[N,i,w,a,e,M]=q;M=nm(M);let E=M+e/rad*S(M)*(1+e*C(M));
for(let k=0;k<8;k++)E-=(E-e/rad*S(E)-M)/(1-e*C(E));
const x=a*(C(E)-e),y=a*Math.sqrt(1-e*e)*S(E),v=nm(Math.atan2(y,x)/rad),r=Math.hypot(x,y),u=v+w;
return{x:r*(C(N)*C(u)-S(N)*S(u)*C(i)),y:r*(S(N)*C(u)+C(N)*S(u)*C(i)),M}}
function calc(J){const d=J-2451543.5,L={};
const ws=282.9404+4.70935e-5*d,s=kep([0,0,ws,1,.016709-1.151e-9*d,356.047+.9856002585*d]);
L[0]=nm(Math.atan2(s.y,s.x)/rad);
const em=EL.mo(d),mo=kep(em);let ml=nm(Math.atan2(mo.y,mo.x)/rad);
const Mm=mo.M,Ms=s.M,Lm=Mm+em[2]+em[0],Ls=Ms+ws,D=Lm-Ls,F=Lm-em[0];
ml+=-1.274*S(Mm-2*D)+.658*S(2*D)-.186*S(Ms)-.059*S(2*Mm-2*D)-.057*S(Mm-2*D+Ms)+.053*S(Mm+2*D)+.046*S(2*D-Ms)+.041*S(Mm-Ms)-.035*S(D)-.031*S(Mm+Ms)-.015*S(2*F-2*D)+.011*S(Mm-4*D);
L[1]=nm(ml);
const g=n=>{const p=kep(EL[n](d));return{p,l:nm(Math.atan2(p.y+s.y,p.x+s.x)/rad)}};
const ma=g('ma'),me=g('me'),ju=g('ju'),ve=g('ve'),sa=g('sa'),Mj=ju.p.M,Mt=sa.p.M;
L[2]=ma.l;L[3]=me.l;L[5]=ve.l;
L[4]=nm(ju.l-.332*S(2*Mj-5*Mt-67.6)-.056*S(2*Mj-2*Mt+21)+.042*S(3*Mj-5*Mt+21)-.036*S(Mj-2*Mt)+.022*C(Mj-Mt)+.023*S(2*Mj-3*Mt+52)-.016*S(Mj-5*Mt-69));
L[6]=nm(sa.l+.812*S(2*Mj-5*Mt-67.6)-.229*C(2*Mj-4*Mt-2)+.119*S(Mj-2*Mt-3)+.046*S(2*Mj-6*Mt-69)+.014*S(Mj-3*Mt+32));
L[8]=nm(em[0]);return L}
function asc(J,lat,lon){const T=(J-2451545)/36525,g=nm(280.46061837+360.98564736629*(J-2451545)+.000387933*T*T),ra=nm(g+lon),e=23.4393-.0130042*T;
return nm(Math.atan2(C(ra),-(S(ra)*C(e)+Math.tan(lat*rad)*S(e)))/rad)}
let rs=[],lon=[];
const $=id=>document.getElementById(id);
const dm=x=>{const v=x%30,d=Math.floor(v),m=Math.round((v-d)*60);return d+'° '+String(m).padStart(2,'0')+'′'};
function showPos(){
let h='<tr><th>'+tx('planet')+'</th><th>'+tx('degree')+'</th><th>'+tx('rashi')+'</th></tr>';
for(let i=0;i<8;i++){h+='<tr><td>'+P[i]+'</td><td>'+dm(lon[i])+'</td><td><select data-i="'+i+'">'+R.map((r,k)=>'<option value="'+k+'"'+(k===rs[i]?' selected':'')+'>'+r+'</option>').join('')+'</select></td></tr>'}
const ra=Math.floor(lon[8]/30),ke=Math.floor(nm(lon[8]+180)/30);
h+='<tr><td>'+tx('rahu')+'</td><td>'+dm(lon[8])+'</td><td>'+R[ra]+'</td></tr><tr><td>'+tx('ketu')+'</td><td>'+dm(nm(lon[8]+180))+'</td><td>'+R[ke]+'</td></tr>';
$('pos').innerHTML=h}
const ABL=[['Ar','Ta','Ge','Cn','Le','Vi','Li','Sc','Sg','Cp','Aq','Pi'],['मे','वृ','मि','कर्','सिं','कन्','तु','वृश्','ध','म','कुं','मी']];let AB=ABL[0];
function showBav(){
const lg=rs[7],ord=[...Array(12)].map((_,i)=>(lg+i)%12),B=[],pt=Array(12).fill(0);
for(let t=0;t<8;t++){const b=Array(12).fill(0);for(let c=0;c<8;c++)for(const h of T[t][c])b[(rs[c]+h-1)%12]++;B.push(b);if(t<7)b.forEach((v,i)=>pt[i]+=v)}
const sum=a=>a.reduce((x,v)=>x+v,0);
let h='<tr><th>'+tx('planet')+'</th><th>'+tx('rashi')+'</th>'+ord.map(r=>'<th>'+AB[r]+'<br><small>'+(r+1)+'</small></th>').join('')+'<th>'+tx('tot')+'</th></tr>';
B.forEach((b,t)=>{h+='<tr><td>'+P[t]+'</td><td>'+(rs[t]+1)+'</td>'+ord.map(r=>'<td>'+b[r]+'</td>').join('')+'<td class="tot">'+sum(b)+'</td></tr>'});
const gt=pt.map((v,i)=>v+B[7][i]);
h+='<tr class="sav"><td>'+tx('ptot')+'</td><td></td>'+ord.map(r=>'<td>'+pt[r]+'</td>').join('')+'<td class="tot">'+sum(pt)+'</td></tr>';
h+='<tr class="sav"><td>'+tx('gtot')+'</td><td></td>'+ord.map(r=>{const p=Math.max(0,Math.min(1,(gt[r]-20)/24))*55;return'<td style="background:color-mix(in srgb,var(--acc) '+p.toFixed(0)+'%,transparent)">'+gt[r]+'</td>'}).join('')+'<td class="tot">'+sum(gt)+'</td></tr>';
$('bav').innerHTML=h;
$('chk').textContent=tx('chk1')+R[lg]+tx('chk2')+sum(gt)+tx('chk3')+sum(pt)+(sum(pt)===337?tx('ok'):tx('chkw'))+')';
let q='<tr><th>'+tx('planet')+'</th>'+ord.map(r=>'<th>'+AB[r]+'<br><small>'+(r+1)+'</small></th>').join('')+'<th>'+tx('tot')+'</th></tr>';
for(let t=0;t<7;t++){const b=B[t].slice();for(const g of [[0,4,8],[1,5,9],[2,6,10],[3,7,11]]){const m=Math.min(...g.map(i=>b[i]));g.forEach(i=>b[i]-=m)}
q+='<tr><td>'+P[t]+'</td>'+ord.map(r=>'<td>'+b[r]+'</td>').join('')+'<td class="tot">'+sum(b)+'</td></tr>'}

// ---------------------------- Astro Master Hub: Saved Birth Profile bridge ----------------------------
function placeLabelForProfile(p){
  if (p.city) return p.city + (p.state ? ", " + p.state : "") + (p.country && p.country!=="India" ? ", " + p.country : "");
  return p.country || "";
}
function profileTo24Hour(p){
  let h = parseInt(p.hour,10) % 12;
  if (String(p.ampm||"AM").toUpperCase()==="PM") h += 12;
  return h;
}
function populateSavedProfileSelect(){
  if (!window.BirthProfile) return;
  const wrap = $("savedProfileWrap"), sel = $("savedProfileSelect");
  const list = BirthProfile.getAll();
  wrap.style.display = "block";
  const prevValue = sel.value;
  sel.innerHTML = '<option value="">— सेव्ड प्रोफाइल चुनें —</option>';
  list.forEach(function(p){
    const icon = p.gender==="Female" ? "स्त्री" : (p.gender==="Other" ? "अन्य" : "पुरुष");
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name + " (" + icon + ", " + String(p.day).padStart(2,"0") + "/" + String(p.month).padStart(2,"0") + "/" + p.year + (p.city ? " - " + p.city : "") + ")";
    sel.appendChild(opt);
  });
  if (prevValue && list.some(function(p){ return p.id===prevValue; })){ sel.value = prevValue; }
}
function applyBirthProfileToForm(profile){
  if (!profile) return;
  $("nm").value = profile.name || "";
  $("d").value = String(profile.day).padStart(2,"0") + "/" + String(profile.month).padStart(2,"0") + "/" + profile.year;
  const h24 = profileTo24Hour(profile);
  $("t").value = String(h24).padStart(2,"0") + ":" + String(profile.minute).padStart(2,"0");
  $("la").value = profile.lat;
  $("lo").value = profile.lon;
  $("z").value = profile.tz;
  const note = $("profileAppliedNote");
  note.style.display = "block";
  note.textContent = "\"" + profile.name + "\" का जन्म-विवरण भर दिया गया — " + placeLabelForProfile(profile) +
    " (Lat " + profile.lat + ", Lon " + profile.lon + ", UTC " + profile.tz + ")। अब Generate अपने आप चल रहा है...";
  $('f').dispatchEvent(new Event('submit', {cancelable:true}));
}
if (window.BirthProfile){
  populateSavedProfileSelect();
  $("savedProfileSelect").addEventListener("change", function(){
    const selectedId = this.value;
    if (!selectedId) return;
    const profile = BirthProfile.getAll().filter(function(p){ return p.id===selectedId; })[0];
    if (profile){ BirthProfile.setActive(profile.id); applyBirthProfileToForm(profile); }
  });
  $("savedProfileSelect").addEventListener("mousedown", populateSavedProfileSelect);
  window.addEventListener("focus", populateSavedProfileSelect);
  $("manageProfilesBtn").addEventListener("click", function(){
    BirthProfile.init();
    const fab = document.getElementById("cc-profile-fab");
    if (fab) fab.click();
  });
  const activeProfile = BirthProfile.get();
  if (activeProfile){
    $("savedProfileSelect").value = activeProfile.id;
    applyBirthProfileToForm(activeProfile);
  }
}
