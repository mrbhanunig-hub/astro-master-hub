<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KP Vastu</title>
<style>
  :root{
    --bg-deep:#0b0f1f;
    --bg-mid:#141a33;
    --panel:#1b2244;
    --panel-2:#232c54;
    --gold:#d9a441;
    --gold-soft:#f0cd85;
    --text:#eef0fb;
    --text-dim:#a9b0d6;
    --line:#333d6b;
    --green:#5fbf7a;
    --red:#e2685f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Segoe UI", "Noto Sans Devanagari", "Nirmala UI", system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 8%, rgba(217,164,65,0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(95,140,255,0.10), transparent 45%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid) 60%, var(--bg-deep));
    color:var(--text);
    min-height:100vh;
    padding:24px 14px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{text-align:center;margin-bottom:24px;}
  h1{
    font-size:2rem;
    margin:0 0 4px;
    letter-spacing:0.02em;
    background:linear-gradient(90deg,var(--gold-soft),var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{color:var(--text-dim);font-size:0.92rem;}
  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .card h2{
    margin:0 0 14px;
    font-size:1.05rem;
    color:var(--gold-soft);
    font-weight:600;
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.grid{grid-template-columns:1fr;}}
  label{display:block;font-size:0.82rem;color:var(--text-dim);margin-bottom:5px;}
  input[type=text], input[type=number]{
    width:100%;
    background:#0f1530;
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:0.95rem;
  }
  input:focus{outline:none;border-color:var(--gold);}
  .field{margin-bottom:4px;}
  .time-row{display:flex;gap:8px;align-items:center;}
  .ampm-btn{
    background:#0f1530;border:1px solid var(--line);color:var(--gold-soft);
    padding:10px 14px;border-radius:8px;cursor:pointer;font-size:0.85rem;min-width:56px;
  }
  .ampm-btn.active{background:var(--gold);color:#1b1200;border-color:var(--gold);}
  .now-btn{
    background:none;border:1px dashed var(--line);color:var(--text-dim);
    padding:9px 12px;border-radius:8px;cursor:pointer;font-size:0.78rem;white-space:nowrap;
  }
  .now-btn:hover{border-color:var(--gold);color:var(--gold-soft);}
  .btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  button.primary{
    background:linear-gradient(90deg,var(--gold),#c88a2f);
    color:#1b1200;border:none;padding:12px 22px;border-radius:8px;
    font-size:0.95rem;font-weight:600;cursor:pointer;
  }
  button.secondary{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    padding:12px 18px;border-radius:8px;cursor:pointer;font-size:0.88rem;
  }
  button.secondary:hover{border-color:var(--gold);color:var(--gold-soft);}
  table{width:100%;border-collapse:collapse;font-size:0.9rem;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--gold-soft);font-weight:600;font-size:0.8rem;text-transform:none;}
  tr:last-child td{border-bottom:none;}
  .tag{
    display:inline-block;background:#0f1530;border:1px solid var(--line);
    padding:2px 8px;border-radius:6px;font-size:0.8rem;color:var(--text-dim);
  }
  .compound{color:var(--gold-soft);font-weight:600;}
  .note{
    font-size:0.8rem;color:var(--text-dim);margin-top:10px;line-height:1.5;
    border-top:1px dashed var(--line);padding-top:10px;
  }
  .warn{
    background:rgba(226,104,95,0.12);border:1px solid rgba(226,104,95,0.4);
    color:#f3b6b0;padding:10px 12px;border-radius:8px;font-size:0.82rem;margin-bottom:14px;
  }
  .toggle-btn{width:100%;text-align:left;font-weight:600;color:var(--gold-soft);}
  .toggle-btn:hover{border-color:var(--gold);}
  .collapsible{margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>KP Vastu</h1>
    <div class="sub">KP आधारित — Planet to Planet Hit • Planet to Cusp Hit</div>
  </header>

  <div class="card">
    <h2>जन्म विवरण (DOB · TOB · POB)</h2>
    <div class="grid">
      <div class="field">
        <label>जन्म तिथि (DD/MM/YYYY)</label>
        <input type="text" id="dob" placeholder="DD/MM/YYYY" maxlength="10">
      </div>
      <div class="field">
        <label>जन्म समय</label>
        <div class="time-row">
          <input type="text" id="tob" placeholder="HH:MM" maxlength="5" style="flex:1;">
          <button type="button" class="ampm-btn" id="ampmBtn">AM</button>
          <button type="button" class="now-btn" id="nowBtn">अभी</button>
        </div>
      </div>
      <div class="field">
        <label>जन्म स्थान — अक्षांश (Latitude)</label>
        <input type="number" id="lat" step="0.0001" value="26.4667">
      </div>
      <div class="field">
        <label>जन्म स्थान — देशांतर (Longitude)</label>
        <input type="number" id="lon" step="0.0001" value="80.6833">
      </div>
      <div class="field">
        <label>स्थान का नाम (केवल संदर्भ हेतु)</label>
        <input type="text" id="placeName" value="Kanpur, Uttar Pradesh">
      </div>
      <div class="field">
        <label>Time Zone (UTC ऑफसेट, घंटे)</label>
        <input type="number" id="tz" step="0.25" value="5.5">
      </div>
    </div>
    <div class="btn-row">
      <button class="primary" id="calcBtn">गणना करें</button>
      <button class="secondary" id="resetBtn">Reset</button>
    </div>
  </div>

  <div id="results"></div>

</div>

<script>
const $ = id => document.getElementById(id);
let ampm = 'AM';

// ---------- date/time auto formatting ----------
$('dob').addEventListener('input', e=>{
  let v = e.target.value.replace(/[^\d]/g,'').slice(0,8);
  let out = v;
  if(v.length>4) out = v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
  else if(v.length>2) out = v.slice(0,2)+'/'+v.slice(2);
  e.target.value = out;
});
$('tob').addEventListener('input', e=>{
  let v = e.target.value.replace(/[^\d]/g,'').slice(0,4);
  let out = v;
  if(v.length>2) out = v.slice(0,2)+':'+v.slice(2);
  e.target.value = out;
});
$('ampmBtn').addEventListener('click', ()=>{
  ampm = ampm==='AM' ? 'PM':'AM';
  $('ampmBtn').textContent = ampm;
});
$('nowBtn').addEventListener('click', ()=>{
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  $('dob').value = `${dd}/${mm}/${yyyy}`;
  let h = d.getHours();
  ampm = h>=12 ? 'PM':'AM';
  $('ampmBtn').textContent = ampm;
  let h12 = h%12; if(h12===0) h12=12;
  $('tob').value = `${String(h12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
});
$('resetBtn').addEventListener('click', ()=>{
  $('dob').value=''; $('tob').value=''; ampm='AM'; $('ampmBtn').textContent='AM';
  $('lat').value='26.4667'; $('lon').value='80.6833'; $('tz').value='5.5';
  $('placeName').value='Kanpur, Uttar Pradesh';
  $('results').innerHTML='';
});

// ---------- astronomical core ----------
const D2R = Math.PI/180, R2D = 180/Math.PI;
function norm360(x){ x = x % 360; if(x<0) x+=360; return x; }
function sinD(x){return Math.sin(x*D2R);}
function cosD(x){return Math.cos(x*D2R);}
function tanD(x){return Math.tan(x*D2R);}
function asinD(x){return Math.asin(x)*R2D;}
function atan2D(y,x){return Math.atan2(y,x)*R2D;}

function julianDay(y,m,d,hourUT){
  if(m<=2){ y-=1; m+=12; }
  const A = Math.floor(y/100);
  const B = 2 - A + Math.floor(A/4);
  const JD0 = Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524.5;
  return JD0 + hourUT/24;
}

// Sun apparent geocentric longitude (Meeus low precision) + Earth-Sun distance R (AU)
function sunPosition(T){
  const L0 = norm360(280.46646 + 36000.76983*T + 0.0003032*T*T);
  const M  = norm360(357.52911 + 35999.05029*T - 0.0001537*T*T);
  const e  = 0.016708634 - 0.000042037*T - 0.0000001267*T*T;
  const C  = (1.914602 - 0.004817*T - 0.000014*T*T)*sinD(M)
           + (0.019993 - 0.000101*T)*sinD(2*M)
           + 0.000289*sinD(3*M);
  const trueLong = L0 + C;
  const trueAnom = M + C;
  const R = 1.000001018*(1-e*e)/(1+e*cosD(trueAnom));
  const omega = 125.04 - 1934.136*T;
  const lambda = trueLong - 0.00569 - 0.00478*sinD(omega);
  return { lon: norm360(lambda), R: R, omega: omega };
}

// obliquity of the ecliptic (apparent)
function obliquity(T, omega){
  const eps0 = 23 + 26/60 + 21.448/3600 - (46.8150*T + 0.00059*T*T - 0.001813*T*T*T)/3600;
  return eps0 + 0.00256*cosD(omega);
}

// Moon apparent geocentric longitude (Meeus abbreviated series)
function moonLongitude(T){
  const Lp = norm360(218.3164477 + 481267.88123421*T - 0.0015786*T*T + T*T*T/538841 - T*T*T*T/65194000);
  const D  = norm360(297.8501921 + 445267.1114034*T - 0.0018819*T*T + T*T*T/545868 - T*T*T*T/113065000);
  const M  = norm360(357.5291092 + 35999.0502909*T - 0.0001536*T*T + T*T*T/24490000);
  const Mp = norm360(134.9633964 + 477198.8675055*T + 0.0087414*T*T + T*T*T/69699 - T*T*T*T/14712000);
  const F  = norm360(93.2720950 + 483202.0175233*T - 0.0036539*T*T - T*T*T/3526000 + T*T*T*T/863310000);
  let lon = Lp
    + 6.289*sinD(Mp)
    + 1.274*sinD(2*D - Mp)
    + 0.658*sinD(2*D)
    - 0.186*sinD(M)
    + 0.059*sinD(2*D - 2*Mp)
    + 0.057*sinD(2*D - M - Mp)
    + 0.053*sinD(2*D + Mp)
    - 0.046*sinD(2*D - M)
    + 0.041*sinD(M - Mp)
    - 0.035*sinD(D)
    - 0.031*sinD(M + Mp)
    - 0.015*sinD(2*F - 2*D)
    + 0.011*sinD(Mp - 4*D);
  return norm360(lon);
}

// mean lunar node (Rahu, tropical)
function rahuLongitude(T){
  const om = 125.04452 - 1934.136261*T + 0.0020708*T*T + T*T*T/450000;
  return norm360(om);
}

// Keplerian elements (J2000, per Julian century) for Mercury..Saturn
const PLANET_ELEMENTS = {
  Mercury:{a:[0.38709927,0.00000037],e:[0.20563593,0.00001906],I:[7.00497902,-0.00594749],
           L:[252.25032350,149472.67411175],peri:[77.45779628,0.16047689],node:[48.33076593,-0.12534081]},
  Venus:  {a:[0.72333566,0.00000390],e:[0.00677672,-0.00004107],I:[3.39467605,-0.00078890],
           L:[181.97909950,58517.81538729],peri:[131.60246718,0.00268329],node:[76.67984255,-0.27769418]},
  Mars:   {a:[1.52371034,0.00001847],e:[0.09339410,0.00007882],I:[1.84969142,-0.00813131],
           L:[-4.55343205,19140.30268499],peri:[-23.94362959,0.44441088],node:[49.55953891,-0.29257343]},
  Jupiter:{a:[5.20288700,-0.00011607],e:[0.04838624,-0.00013253],I:[1.30439695,-0.00183714],
           L:[34.39644051,3034.74612775],peri:[14.72847983,0.21252668],node:[100.47390909,0.20469106]},
  Saturn: {a:[9.53667594,-0.00125060],e:[0.05386179,-0.00050991],I:[2.48599187,0.00193609],
           L:[49.95424423,1222.49362201],peri:[92.59887831,-0.41897216],node:[113.66242448,-0.28867794],
           pert:{b:0.00025899,c:-0.13434469,f:0.87320147,s:38.35125000}}
};

function solveKepler(Mdeg, e){
  let M = norm360(Mdeg);
  if(M>180) M -= 360;
  let Mr = M*D2R;
  let E = Mr;
  for(let i=0;i<50;i++){
    const dE = (E - e*Math.sin(E) - Mr)/(1 - e*Math.cos(E));
    E -= dE;
    if(Math.abs(dE) < 1e-9) break;
  }
  return E*R2D;
}

function heliocentricXYZ(elName, T){
  const el = PLANET_ELEMENTS[elName];
  const a = el.a[0] + el.a[1]*T;
  const e = el.e[0] + el.e[1]*T;
  const I = el.I[0] + el.I[1]*T;
  const L = norm360(el.L[0] + el.L[1]*T);
  const peri = norm360(el.peri[0] + el.peri[1]*T);
  const node = norm360(el.node[0] + el.node[1]*T);
  let M = norm360(L - peri);
  if(el.pert){
    const p = el.pert;
    M = norm360(M + p.b*T*T + p.c*cosD(p.f*T) + p.s*sinD(p.f*T));
  }
  const w = norm360(peri - node);
  const E = solveKepler(M, e);
  const xp = a*(cosD(E) - e);
  const yp = a*Math.sqrt(1-e*e)*sinD(E);
  const cosO=cosD(node), sinO=sinD(node), cosw=cosD(w), sinw=sinD(w), cosI=cosD(I), sinI=sinD(I);
  const x = (cosO*cosw - sinO*sinw*cosI)*xp + (-cosO*sinw - sinO*cosw*cosI)*yp;
  const y = (sinO*cosw + cosO*sinw*cosI)*xp + (-sinO*sinw + cosO*cosw*cosI)*yp;
  const z = (sinw*sinI)*xp + (cosw*sinI)*yp;
  return {x,y,z};
}

function earthXYZ(sunLon, sunR){
  // Earth heliocentric = opposite of geocentric Sun direction, at distance R, z=0 (defines ecliptic plane)
  return { x: -sunR*cosD(sunLon), y: -sunR*sinD(sunLon), z:0 };
}

function planetGeocentricLongitude(elName, T, earth){
  const h = heliocentricXYZ(elName, T);
  const gx = h.x - earth.x, gy = h.y - earth.y, gz = h.z - earth.z;
  return norm360(atan2D(gy, gx));
}

// ---------- Ayanamsa (Lahiri, with small KP/Krishnamurti calibration) ----------
function lahiriAyanamsa(T){
  // Lahiri ayanamsa at J2000.0 ~ 23.85333 deg, precessing at ~50.2877"/year (general precession)
  const yearsFromJ2000 = T*100;
  const base2000 = 23 + 51/60 + 14/3600; // 23.85389
  const ratePerYear = 50.2877/3600;
  return base2000 + ratePerYear*yearsFromJ2000;
}
function kpAyanamsa(T){
  // Krishnamurti ayanamsa runs a small, roughly constant offset below Lahiri (~1-6 arcmin, needs
  // calibration against a reference KP chart — see note in the app).
  return lahiriAyanamsa(T) - (5/60);
}

// ---------- Rashi / compound degree helpers ----------
const RASHI_NAMES = ["मेष","वृषभ","मिथुन","कर्क","सिंह","कन्या","तुला","वृश्चिक","धनु","मकर","कुम्भ","मीन"];
function rashiInfo(siderealLon){
  const lon = norm360(siderealLon);
  const R = Math.floor(lon/30) + 1; // 1..12
  const degInSign = lon - (R-1)*30;
  const compound = (R-1)*30 + degInSign; // == lon, restated per user's formula
  return { R, name: RASHI_NAMES[R-1], degInSign, compound, lon };
}
function fmtDMS(deg){
  const d = Math.floor(deg);
  const mFull = (deg-d)*60;
  const m = Math.floor(mFull);
  const s = Math.round((mFull-m)*60);
  return `${d}°${String(m).padStart(2,'0')}'${String(s).padStart(2,'0')}"`;
}

// ---------- Sidereal time / Ascendant / Placidus cusps ----------
function gmstDeg(JD){
  const T = (JD - 2451545.0)/36525;
  let g = 280.46061837 + 360.98564736629*(JD-2451545.0) + 0.000387933*T*T - (T*T*T)/38710000;
  return norm360(g);
}
function ascendantLon(ramc, eps, phi){
  const y = cosD(ramc);
  const x = -(sinD(eps)*tanD(phi) + cosD(eps)*sinD(ramc));
  return norm360(atan2D(y,x));
}
function mcLon(ramc, eps){
  return norm360(atan2D(sinD(ramc), cosD(ramc)*cosD(eps)));
}
// RA (0-360) of ecliptic point lambda, beta=0
function raOfLambda(lambda, eps){
  return norm360(atan2D(sinD(lambda)*cosD(eps), cosD(lambda)));
}
// Placidus intermediate cusp via iterative trisection of the semi-arc.
// Cusps 11,12: trisect the diurnal semi-arc, measured forward from MC.
// Cusps 2,3: trisect the nocturnal semi-arc, measured backward from IC
// (fraction 2/3 -> cusp 2, closer to Asc; fraction 1/3 -> cusp 3, closer to IC).
function placidusCusp(anchorRA, fraction, diurnal, dir){
  let ra = norm360(anchorRA + dir*fraction*90);
  let lambda = norm360(atan2D(sinD(ra), cosD(ra)*cosD(eps_g)));
  for(let i=0;i<40;i++){
    const decl = asinD(sinD(eps_g)*sinD(lambda));
    let cosH = diurnal ? -tanD(phi_g)*tanD(decl) : tanD(phi_g)*tanD(decl);
    cosH = Math.max(-1, Math.min(1, cosH));
    const arc = Math.acos(cosH)*R2D;
    const raTarget = norm360(anchorRA + dir*fraction*arc);
    const lambdaNew = norm360(atan2D(sinD(raTarget), cosD(raTarget)*cosD(eps_g)));
    if(Math.abs(((lambdaNew-lambda+540)%360)-180) < 1e-7){ lambda = lambdaNew; break; }
    lambda = lambdaNew;
  }
  return lambda;
}
let eps_g, phi_g; // set per-chart in computeChart before calling placidusCusp

function computeChart(y,m,d,hh,mm,tz,lat,lon){
  const hourUT = hh + mm/60 - tz;
  const JD = julianDay(y,m,d,hourUT);
  const T = (JD - 2451545.0)/36525;

  const sun = sunPosition(T);
  const eps = obliquity(T, sun.omega);
  const ayan = kpAyanamsa(T);

  const earth = earthXYZ(sun.lon, sun.R);

  const tropical = {
    Su: sun.lon,
    Mo: moonLongitude(T),
    Ma: planetGeocentricLongitude('Mars', T, earth),
    Me: planetGeocentricLongitude('Mercury', T, earth),
    Ju: planetGeocentricLongitude('Jupiter', T, earth),
    Ve: planetGeocentricLongitude('Venus', T, earth),
    Sa: planetGeocentricLongitude('Saturn', T, earth),
  };
  const rahuTrop = rahuLongitude(T);
  tropical.Ra = rahuTrop;
  tropical.Ke = norm360(rahuTrop + 180);

  const sidereal = {};
  for(const k in tropical){ sidereal[k] = norm360(tropical[k] - ayan); }

  const ramc = norm360(gmstDeg(JD)*1 + lon); // LST in degrees (east longitude positive)
  const ascTrop = ascendantLon(ramc, eps, lat);
  const mcTrop = mcLon(ramc, eps);

  const raAsc = raOfLambda(ascTrop, eps);
  eps_g = eps; phi_g = lat;

  const cuspTrop = {};
  cuspTrop[1] = ascTrop;
  cuspTrop[10] = mcTrop;
  cuspTrop[7] = norm360(ascTrop+180);
  cuspTrop[4] = norm360(mcTrop+180);
  cuspTrop[11] = placidusCusp(ramc, 1/3, true, 1);
  cuspTrop[12] = placidusCusp(ramc, 2/3, true, 1);
  cuspTrop[2]  = placidusCusp(norm360(ramc+180), 2/3, false, -1);
  cuspTrop[3]  = placidusCusp(norm360(ramc+180), 1/3, false, -1);
  cuspTrop[5] = norm360(cuspTrop[11]+180);
  cuspTrop[6] = norm360(cuspTrop[12]+180);
  cuspTrop[8] = norm360(cuspTrop[2]+180);
  cuspTrop[9] = norm360(cuspTrop[3]+180);

  const cuspSid = {};
  for(let i=1;i<=12;i++){ cuspSid[i] = norm360(cuspTrop[i]-ayan); }

  return { sidereal, cuspSid, ayanamsa: ayan, JD };
}

// House (D1) direction, based on which house (from Lagna) the planet occupies
const HOUSE_DIRECTIONS = {1:"East",2:"NE",3:"NE",4:"North",5:"NW",6:"NW",7:"West",8:"SW",9:"SW",10:"South",11:"SE",12:"SE"};
// Rashi direction, based on which sign (1=Mesh..12=Meen) the planet occupies
const RASHI_DIRECTIONS = {1:"East",2:"NW",3:"NNW",4:"NNE",5:"ENE",6:"North",7:"WSW",8:"SSW",9:"NE",10:"South",11:"West",12:"SE"};

function findHouse(lon, cuspSid){
  for(let i=1;i<=12;i++){
    const start = cuspSid[i];
    const nextIdx = i===12?1:i+1;
    const end = cuspSid[nextIdx];
    const span = norm360(end - start);
    const pos = norm360(lon - start);
    if(span === 0 ? pos === 0 : pos < span) return i;
  }
  return 12;
}

// ---------- KP Vastu — Hit Logic (Part A: Planet-to-Planet, Part B: Planet-to-Cusp) ----------
const HIT_RANGES = [ {lo:42, hi:48}, {lo:85, hi:95}, {lo:172, hi:188} ];
function checkHit(diff){
  for(const r of HIT_RANGES){
    if(diff >= r.lo && diff <= r.hi) return `${r.lo}°-${r.hi}°`;
  }
  return null;
}
function computeHits(sourceMap, targetMap, excludeSelf){
  // sourceMap/targetMap: {label: compoundDegree}
  const hits = [];
  for(const sLabel in sourceMap){
    const Dp = sourceMap[sLabel];
    for(const tLabel in targetMap){
      if(excludeSelf && sLabel===tLabel) continue;
      const Dt = targetMap[tLabel];
      const diff = norm360(Dt - Dp);
      const range = checkHit(diff);
      if(range){
        hits.push({source:sLabel, target:tLabel, diff:diff.toFixed(2), range});
      }
    }
  }
  return hits;
}


const PLANET_LABELS = {Su:"सूर्य (Sun)",Mo:"चन्द्र (Moon)",Ma:"मंगल (Mars)",Me:"बुध (Mercury)",
  Ju:"गुरु (Jupiter)",Ve:"शुक्र (Venus)",Sa:"शनि (Saturn)",Ra:"राहु (Rahu)",Ke:"केतु (Ketu)"};
const PLANET_ORDER = ["Su","Mo","Ma","Me","Ju","Ve","Sa","Ra","Ke"];
const CUSP_LABELS = {1:"Cusp 1 (Lagna)",2:"Cusp 2",3:"Cusp 3",4:"Cusp 4 (IC)",5:"Cusp 5",6:"Cusp 6",
  7:"Cusp 7",8:"Cusp 8",9:"Cusp 9",10:"Cusp 10 (MC)",11:"Cusp 11",12:"Cusp 12"};

function renderResults(chart){
  let planetRows = PLANET_ORDER.map(k=>{
    const ri = rashiInfo(chart.sidereal[k]);
    const house = findHouse(chart.sidereal[k], chart.cuspSid);
    const hd = HOUSE_DIRECTIONS[house];
    const rd = RASHI_DIRECTIONS[ri.R];
    return `<tr><td>${PLANET_LABELS[k]}</td><td><span class="tag">${ri.name}</span></td>
      <td>${fmtDMS(ri.degInSign)}</td><td class="compound">${ri.compound.toFixed(4)}°</td>
      <td>${house} / ${hd}</td><td>${rd}</td></tr>`;
  }).join('');

  let cuspRows = [];
  for(let i=1;i<=12;i++){
    const ri = rashiInfo(chart.cuspSid[i]);
    cuspRows.push(`<tr><td>${CUSP_LABELS[i]}</td><td><span class="tag">${ri.name}</span></td>
      <td>${fmtDMS(ri.degInSign)}</td><td class="compound">${ri.compound.toFixed(4)}°</td></tr>`);
  }

  // build degree maps for hit theory
  const planetDeg = {};
  PLANET_ORDER.forEach(k=> planetDeg[PLANET_LABELS[k]] = norm360(chart.sidereal[k]));
  const cuspDeg = {};
  for(let i=1;i<=12;i++) cuspDeg[CUSP_LABELS[i]] = norm360(chart.cuspSid[i]);

  const p2pHits = computeHits(planetDeg, planetDeg, true);
  const p2cHits = computeHits(planetDeg, cuspDeg, false);

  function hitTableRows(hits){
    if(hits.length===0) return `<tr><td colspan="4" style="color:var(--text-dim);">कोई hit नहीं मिला</td></tr>`;
    return hits.map(h=>`<tr><td>${h.source}</td><td>${h.target}</td>
      <td>${h.diff}°</td><td><span class="tag" style="color:var(--red);border-color:var(--red);">Negative Hit (${h.range})</span></td></tr>`).join('');
  }

  $('results').innerHTML = `
    <div class="card">
      <button class="secondary toggle-btn" data-target="sec-planets">Show Planets — Compound Degree</button>
      <div class="collapsible" id="sec-planets" style="display:none;">
        <table>
          <tr><th>ग्रह</th><th>राशि</th><th>राशि में अंश</th><th>Compound Degree</th><th>HD</th><th>RD</th></tr>
          ${planetRows}
        </table>
        <div class="note">HD = House Direction (D1 house का direction), RD = Rashi Direction (राशि का direction)</div>
      </div>
    </div>
    <div class="card">
      <button class="secondary toggle-btn" data-target="sec-cusps">Show Cusps — Compound Degree</button>
      <div class="collapsible" id="sec-cusps" style="display:none;">
        <table>
          <tr><th>Cusp</th><th>राशि</th><th>राशि में अंश</th><th>Compound Degree</th></tr>
          ${cuspRows.join('')}
        </table>
        <div class="note">
          Ayanamsa used: ${fmtDMS(chart.ayanamsa)} (KP/Krishnamurti, calibrated ≈5' below Lahiri).
        </div>
      </div>
    </div>
    <div class="card">
      <button class="secondary toggle-btn" data-target="sec-p2p">Show Part A — Planet to Planet Hit</button>
      <div class="collapsible" id="sec-p2p" style="display:none;">
        <table>
          <tr><th>Planet (Source)</th><th>Planet (Target)</th><th>Forward Diff</th><th>Result</th></tr>
          ${hitTableRows(p2pHits)}
        </table>
      </div>
    </div>
    <div class="card">
      <button class="secondary toggle-btn" data-target="sec-p2c">Show Part B — Planet to Cusp Hit</button>
      <div class="collapsible" id="sec-p2c" style="display:none;">
        <table>
          <tr><th>Planet (Source)</th><th>Cusp (Target)</th><th>Forward Diff</th><th>Result</th></tr>
          ${hitTableRows(p2cHits)}
        </table>
        <div class="note">
          Hit rule: किसी भी दो बिंदुओं का forward difference (Target − Source, mod 360°) यदि 42°-48°, 85°-95°, या 172°-188° के बीच आता है,
          तो Source planet, Target को Negative Hit देता है।
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = document.getElementById(btn.dataset.target);
      const isHidden = target.style.display === 'none';
      target.style.display = isHidden ? 'block' : 'none';
      btn.textContent = (isHidden ? 'Hide ' : 'Show ') + btn.textContent.replace(/^(Show|Hide) /, '');
    });
  });
}

  let hh = parseInt(tparts[0],10), mm = parseInt(tparts[1],10);
  if(ampm==='PM' && hh<12) hh+=12;
