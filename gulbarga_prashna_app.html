// ============================= KP ASTRO ENGINE =============================

function norm360(x) { x = x % 360; if (x < 0) x += 360; return x; }
function deg2rad(d) { return (d * Math.PI) / 180; }
function rad2deg(r) { return (r * 180) / Math.PI; }

function dateToJD(date) {
  return date.getTime() / 86400000 + 2440587.5;
}

// KP (Krishnamurti) ayanamsa — this is what KP/Gulbarga-theory software (e.g.
// Nakshatra Gold, Jagannatha Hora's "KP-Newcomb" mode) uses, not plain Lahiri;
// the two differ by roughly 6 arcminutes in the current era, which is small
// for signs/stars but large enough to flip a Sub Lord near a boundary.
// Calibrated here against a verified Nakshatra Gold chart (30 Aug 2026,
// 20:02:37 IST, Kanpur) where the required ayanamsa was 24°08'08" (24.13544°).
function lahiriAyanamsa(date) {
  const JD2000 = 2451544.5;
  const yearsSince2000 = (dateToJD(date) - JD2000) / 365.25;
  const base = 23.757423; // KP ayanamsa base at Jan 1 2000 00:00 UT
  const rate = 0.0141775; // deg/year (~50.4"/year, close to Lahiri's rate)
  return base + yearsSince2000 * rate;
}

// Mean obliquity of the ecliptic (Meeus 22.2)
function obliquity(date) {
  const T = (dateToJD(date) - 2451545.0) / 36525;
  return 23.4392911 - 0.0130042 * T - 0.00000016 * T * T + 0.000000504 * T * T * T;
}

// Greenwich mean sidereal time, in degrees (Meeus 12.4)
function gstDegrees(date) {
  const JD = dateToJD(date);
  const T = (JD - 2451545.0) / 36525;
  const g = 280.46061837 + 360.98564736629 * (JD - 2451545.0) + 0.000387933 * T * T - (T * T * T) / 38710000;
  return norm360(g);
}

// Tropical ecliptic longitude of the Ascendant
function ascendantTropical(date, latitude, longitude) {
  const ramc = norm360(gstDegrees(date) + longitude); // longitude: east positive
  const eps = deg2rad(obliquity(date));
  const ramcR = deg2rad(ramc);
  const latR = deg2rad(latitude);
  const asc = rad2deg(
    Math.atan2(-Math.cos(ramcR), Math.sin(ramcR) * Math.cos(eps) + Math.tan(latR) * Math.sin(eps))
  );
  return norm360(asc + 180);
}

// Tropical ecliptic longitude of the Midheaven
function mcTropical(date, longitude) {
  const ramc = norm360(gstDegrees(date) + longitude);
  const eps = deg2rad(obliquity(date));
  const ramcR = deg2rad(ramc);
  const mc = rad2deg(Math.atan2(Math.sin(ramcR), Math.cos(ramcR) * Math.cos(eps)));
  return norm360(mc);
}

function signedDiff(a, b) { return ((a - b + 540) % 360) - 180; }

// Convert a Right Ascension (on the ecliptic, i.e. for a house-cusp point)
// back to ecliptic longitude.
function raToLongitude(raDeg, epsDeg) {
  const ra = deg2rad(raDeg), eps = deg2rad(epsDeg);
  return norm360(rad2deg(Math.atan2(Math.sin(ra), Math.cos(eps) * Math.cos(ra))));
}

// Placidus intermediate-cusp RA via fixed-point iteration on the semi-arc
// trisection condition (standard Placidus definition).
//   cusps 11/12: RA = RAMC + acos(-sin(RA)*tanE*tanL) / F
//   cusps 2/3:   RA = RAMC + 180 - acos(sin(RA)*tanE*tanL) / F
function placidusCuspRA(ramc, initOffset, F, upperMeridian, epsDeg, latDeg, iterations = 40) {
  const tanE = Math.tan(deg2rad(epsDeg)), tanL = Math.tan(deg2rad(latDeg));
  let RA = ramc + initOffset;
  for (let i = 0; i < iterations; i++) {
    const s = Math.sin(deg2rad(RA));
    const x = Math.max(-1, Math.min(1, upperMeridian ? -s * tanE * tanL : s * tanE * tanL));
    const acos = rad2deg(Math.acos(x));
    RA = upperMeridian ? ramc + acos / F : ramc + 180 - acos / F;
  }
  return RA;
}

// Placidus house cusps (tropical longitudes), cusp[0]=house1 ... cusp[11]=house12
function placidusCusps(ascTrop, mcTrop, latDeg, epsDeg, ramc) {
  const c1 = norm360(ascTrop), c10 = norm360(mcTrop);
  const c4 = norm360(c10 + 180), c7 = norm360(c1 + 180);

  const c11 = raToLongitude(placidusCuspRA(ramc, 30, 3, true, epsDeg, latDeg), epsDeg);
  const c12 = raToLongitude(placidusCuspRA(ramc, 60, 1.5, true, epsDeg, latDeg), epsDeg);
  const c2 = raToLongitude(placidusCuspRA(ramc, 120, 1.5, false, epsDeg, latDeg), epsDeg);
  const c3 = raToLongitude(placidusCuspRA(ramc, 150, 3, false, epsDeg, latDeg), epsDeg);

  const c5 = norm360(c11 + 180), c6 = norm360(c12 + 180);
  const c8 = norm360(c2 + 180), c9 = norm360(c3 + 180);

  return [c1, c2, c3, c4, c5, c6, c7, c8, c9, c10, c11, c12];
}

// Geocentric apparent tropical ecliptic longitude of the Moon
// (Meeus ch. 47, main ~60-term periodic series — accurate to ~0.01-0.02°,
// verified against a reference ephemeris)
const MOON_TERMS = [
  [0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],
  [0,1,0,0,-185116],[0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],
  [2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],
  [0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],
  [4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],
  [2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],
  [2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],
  [2,0,-1,2,-2602],[2,-1,-2,0,2390],[1,0,1,0,-2348],[2,-2,0,0,2236],
  [0,1,2,0,-2120],[0,2,0,0,-2069],[2,-2,-1,0,2048],[2,0,1,-2,-1773],
  [2,0,0,2,-1595],[4,-1,-1,0,1215],[0,0,2,2,-1110],[3,0,-1,0,-892],
  [2,1,1,0,-810],[4,-1,-2,0,759],[0,2,-1,0,-713],[2,2,-1,0,-700],
  [2,1,-2,0,691],[2,-1,0,-2,596],[4,0,1,0,549],[0,0,4,0,537],
  [4,-1,0,0,520],[1,0,-2,0,-487],[2,1,0,-2,-399],[0,0,2,-2,-381],
  [1,1,1,0,351],[3,0,-2,0,-340],[4,0,-3,0,330],[2,-1,2,0,327],
  [0,2,1,0,-323],[1,1,-1,0,299],[2,0,3,0,294],
];

function moonLongitudeTropical(date) {
  const T = (dateToJD(date) - 2451545.0) / 36525;
  const Lp = norm360(218.3164477 + 481267.88123421 * T - 0.0015786 * T * T + Math.pow(T, 3) / 538841 - Math.pow(T, 4) / 65194000);
  const D  = norm360(297.8501921 + 445267.1114034 * T - 0.0018819 * T * T + Math.pow(T, 3) / 545868 - Math.pow(T, 4) / 113065000);
  const M  = norm360(357.5291092 + 35999.0502909 * T - 0.0001536 * T * T + Math.pow(T, 3) / 24490000);
  const Mp = norm360(134.9633964 + 477198.8675055 * T + 0.0087414 * T * T + Math.pow(T, 3) / 69699 - Math.pow(T, 4) / 14712000);
  const F  = norm360(93.2720950 + 483202.0175233 * T - 0.0036539 * T * T - Math.pow(T, 3) / 3526000 + Math.pow(T, 4) / 863310000);
  const E = 1 - 0.002516 * T - 0.0000074 * T * T;

  let sumL = 0;
  for (const [d, m, mp, f, coeff] of MOON_TERMS) {
    let e = 1;
    if (Math.abs(m) === 1) e = E;
    else if (Math.abs(m) === 2) e = E * E;
    sumL += coeff * e * Math.sin(deg2rad(D * d + M * m + Mp * mp + F * f));
  }
  const A1 = norm360(119.75 + 131.849 * T);
  const A2 = norm360(53.09 + 479264.290 * T);
  sumL += 3958 * Math.sin(deg2rad(A1));
  sumL += 1962 * Math.sin(deg2rad(Lp - F));
  sumL += 318 * Math.sin(deg2rad(A2));

  return norm360(Lp + sumL / 1000000);
}

const VIM_ORDER = ["Ketu", "Venus", "Sun", "Moon", "Mars", "Rahu", "Jupiter", "Saturn", "Mercury"];
const VIM_YEARS = { Ketu: 7, Venus: 20, Sun: 6, Moon: 10, Mars: 7, Rahu: 18, Jupiter: 16, Saturn: 19, Mercury: 17 };
const TOTAL_YEARS = 120;

const SIGN_LORDS = ["Mars", "Venus", "Mercury", "Moon", "Sun", "Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Saturn", "Jupiter"];
const SIGN_NAMES = ["Aries", "Taurus", "Gemini", "Cancer", "Leo", "Virgo", "Libra", "Scorpio", "Sagittarius", "Capricorn", "Aquarius", "Pisces"];
const DAY_LORDS = ["Sun", "Moon", "Mars", "Mercury", "Jupiter", "Venus", "Saturn"]; // JS getUTCDay(): 0=Sunday

function signLord(lon) { return SIGN_LORDS[Math.floor(norm360(lon) / 30)]; }
function signName(lon) { return SIGN_NAMES[Math.floor(norm360(lon) / 30)]; }
function nakshatraIndex(lon) { return Math.floor(norm360(lon) / (360 / 27)); }
function nakshatraLord(lon) { return VIM_ORDER[nakshatraIndex(lon) % 9]; }

// Divide [startDeg, startDeg+spanDeg) into 9 parts proportional to Vimshottari
// years, cyclically starting at `startLord`. Returns the part containing posDeg.
function subdivide(startDeg, spanDeg, startLord, posDeg) {
  const startIdx = VIM_ORDER.indexOf(startLord);
  let cursor = startDeg;
  for (let i = 0; i < 9; i++) {
    const lord = VIM_ORDER[(startIdx + i) % 9];
    const partSpan = (VIM_YEARS[lord] / TOTAL_YEARS) * spanDeg;
    if (posDeg < cursor + partSpan || i === 8) return { lord, subStart: cursor, subSpan: partSpan };
    cursor += partSpan;
  }
}

function subLordInfo(lon) {
  lon = norm360(lon);
  const nIdx = nakshatraIndex(lon);
  const span = 360 / 27;
  const nakStart = nIdx * span;
  const nLord = VIM_ORDER[nIdx % 9];
  return subdivide(nakStart, span, nLord, lon); // {lord, subStart, subSpan}
}

function subSubLord(lon) {
  const sub = subLordInfo(lon);
  return subdivide(sub.subStart, sub.subSpan, sub.lord, norm360(lon)).lord;
}

function dayLord(date) { return DAY_LORDS[date.getUTCDay()]; }

// Compute the full RP (Ruling Planets) + Lagna SSL for a given moment/place.
// dateStr: "YYYY-MM-DD", timeStr: "HH:MM" (or "HH:MM:SS"), tzOffsetHours: e.g. 5.5 for IST
function castPrashna(dateStr, timeStr, tzOffsetHours, latitude, longitude, ayanamsaOverride) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const timeParts = timeStr.split(":").map(Number);
  const hh = timeParts[0] || 0, mm = timeParts[1] || 0, ss = timeParts[2] || 0;
  const utcMs = Date.UTC(y, m - 1, d, hh, mm, ss) - tzOffsetHours * 3600 * 1000;
  const date = new Date(utcMs);

  const ayan = (typeof ayanamsaOverride === "number" && !Number.isNaN(ayanamsaOverride))
    ? ayanamsaOverride
    : lahiriAyanamsa(date);
  const moonTrop = moonLongitudeTropical(date);
  const moonSid = norm360(moonTrop - ayan);
  const ascTrop = ascendantTropical(date, latitude, longitude);
  const ascSid = norm360(ascTrop - ayan);
  const mcTrop = mcTropical(date, longitude);
  const ramc = norm360(gstDegrees(date) + longitude);
  const eps = obliquity(date);

  const L = signLord(ascSid);       // Lagna Lord
  const S = nakshatraLord(moonSid); // Moon Star Lord
  const R = signLord(moonSid);      // Moon Rashi Lord
  const D = dayLord(date);          // Day Lord
  const ssl = subSubLord(ascSid);   // Lagna's Sub-Sub Lord

  const rp = [
    { code: "L", label: "Lagna Lord", planet: L },
    { code: "S", label: "Moon Star Lord", planet: S },
    { code: "R", label: "Moon Rashi Lord", planet: R },
    { code: "D", label: "Day Lord", planet: D },
  ];
  const answer = rp.some((x) => x.planet === ssl) ? "YES" : "NO";

  // Full cusp detail (Placidus), for houses 1-12
  const cuspsTrop = placidusCusps(ascTrop, mcTrop, latitude, eps, ramc);
  const cusps = cuspsTrop.map((trop, i) => {
    const sid = norm360(trop - ayan);
    const sub = subLordInfo(sid);
    return {
      house: i + 1,
      lonSid: sid,
      sign: signName(sid),
      signLord: signLord(sid),
      starLord: nakshatraLord(sid),
      subLord: sub.lord,
      subSubLord: subSubLord(sid),
    };
  });

  return {
    ayanamsa: ayan, moonSid, ascSid,
    ascSign: signName(ascSid), moonSign: signName(moonSid),
    rp, ssl, answer, cusps,
  };
}

function pad2(n) { return String(n).padStart(2, "0"); }
function nowDateStr() {
  const n = new Date();
  return `${pad2(n.getDate())}/${pad2(n.getMonth() + 1)}/${n.getFullYear()}`;
}
function nowTimeStr() {
  const n = new Date();
  return `${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())}`;
}
// "DD/MM/YYYY" -> "YYYY-MM-DD" (returns null if not a complete, valid date)
function ddmmyyyyToISO(s) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s || "");
  if (!m) return null;
  const [, dd, mm, yyyy] = m;
  const d = Number(dd), mo = Number(mm), y = Number(yyyy);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return `${yyyy}-${mm}-${dd}`;
}
// Auto-insert "/" as the user types digits: 3082026 -> 30/08/2026
function formatDateTyping(raw, prevValue) {
  const digits = raw.replace(/\D/g, "").slice(0, 8);
  let out = digits.slice(0, 2);
  if (digits.length > 2) out += "/" + digits.slice(2, 4);
  if (digits.length > 4) out += "/" + digits.slice(4, 8);
  return out;
}

                          <td style={styles.cuspTd}>{c.signLord}</td>
                          <td style={styles.cuspTd}>{c.starLord}</td>
                          <td style={styles.cuspTd}>{c.subLord}</td>
                          <td style={styles.cuspTd}>{c.subSubLord}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          <p style={styles.footnote}>
            Rule: if any of L, S, R, D matches the Lagna's Sub-Sub Lord (SSL) at the moment of the
            question, the answer is YES; otherwise NO. Ascendant precision depends on accurate
            coordinates and clock time — for a boundary-close SSL, verify against a dedicated KP tool.
          </p>
        </div>
      </div>
    </div>
  );
}
