<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शुभ मुहूर्त / Shubh Muhurat</title>
<style>
  :root{
    --bg:#fdf6e9; --card:#fffdf8; --accent:#b5651d; --accent2:#8a3324;
    --good:#2e7d32; --bad:#c62828; --neutral:#6b5b3a; --line:#e6d8b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Nirmala UI','Noto Sans Devanagari',system-ui,sans-serif;
    background:linear-gradient(180deg,#fff8ea,#f7ead0); color:#3a2f1f; padding:16px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  .langbar{display:flex;justify-content:center;gap:8px;margin-bottom:10px;}
  .langbtn{
    padding:6px 16px;border-radius:20px;border:1px solid var(--accent);
    background:#fff;color:var(--accent2);font-weight:600;font-size:.85rem;cursor:pointer;
  }
  .langbtn.active{background:var(--accent2);color:#fff;}
  h1{ text-align:center; font-size:1.3rem; color:var(--accent2); margin:6px 0 4px; }
  .sub{text-align:center;color:var(--neutral);font-size:.85rem;margin-bottom:18px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(120,90,30,.08);
  }
  label{display:block;font-size:.9rem;margin:10px 0 4px;color:var(--accent2);font-weight:600;}
  select,input[type=text],input[type=time]{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--line);
    background:#fffef9; font-size:1rem; color:#3a2f1f;
  }
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  button.primary{
    width:100%; margin-top:16px; padding:13px; border:none; border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    font-size:1.05rem; font-weight:700; cursor:pointer;
  }
  button.secondary{
    width:100%; margin-top:10px; padding:13px; border:none; border-radius:10px;
    background:linear-gradient(135deg,#8d8d8d,#5c5c5c); color:#fff;
    font-size:1.05rem; font-weight:700; cursor:pointer;
  }
  button:active{opacity:.85;}
  .hidden{display:none;}
  .ganesh{ text-align:center; font-size:1.15rem; font-weight:700; color:var(--accent2); margin-bottom:4px; letter-spacing:.5px; }
  .verdict-card{ text-align:center; padding:20px 16px; }
  .verdict-badge{ display:inline-block; padding:8px 18px; border-radius:24px; font-weight:700; font-size:1.05rem; margin-top:6px; }
  .v-great{background:#e6f4ea;color:var(--good);}
  .v-ok{background:#fdf6e3;color:#b8860b;}
  .v-bad{background:#fbe9e7;color:var(--bad);}
  .verdict-sub{font-size:.88rem;color:var(--neutral);margin-top:8px;}
  .result-title{ font-size:1rem; font-weight:700; color:var(--accent2); margin:0 0 10px; border-bottom:2px solid var(--line); padding-bottom:6px; }
  .tara-badge{ display:inline-block; padding:4px 12px; border-radius:20px; font-weight:700; font-size:.9rem; }
  .tara-good{background:#e6f4ea;color:var(--good);}
  .tara-bad{background:#fbe9e7;color:var(--bad);}
  .tara-neutral{background:#f1ecdd;color:var(--neutral);}
  .slot{ gap:8px; flex-wrap:wrap; display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:8px; margin:6px 0; font-size:.92rem; }
  .slot.best{background:#e6f4ea; border-left:4px solid var(--good);}
  .slot.bad{background:#fbe9e7; border-left:4px solid var(--bad);}
  .slot.fort{background:#e3f2fd; border-left:4px solid #1976d2;}
  .slot.ok{background:#fdf6e3; border-left:4px solid #b8860b;}
  .swatch-row{display:flex;align-items:center;gap:12px;margin:8px 0;}
  .swatch{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex-shrink:0;}
  .upay-box{ background:#fff8ec; border:1px dashed var(--accent); border-radius:10px; padding:12px; margin-top:8px; font-size:.95rem; line-height:1.7; }
  .disclaimer{ margin-top:16px; font-size:.8rem; color:var(--neutral); text-align:center; font-style:italic; line-height:1.5; }
  .note{font-size:.78rem;color:var(--neutral);margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <button class="langbtn active" id="btnHi" onclick="setLang('hi')">हिंदी</button>
    <button class="langbtn" id="btnEn" onclick="setLang('en')">English</button>
  </div>
  <h1 id="tTitle">🕉️ शुभ मुहूर्त</h1>
  <div class="sub" id="tSubtitle" style="font-weight:600;">उपाय सहित</div>
  <div class="sub" id="tDesc">जन्म विवरण एवं कार्य की तारीख भरें</div>

  <div class="card">
    <label id="lDob">जन्म तिथि (DOB)</label>
    <input type="text" id="dob" placeholder="dd/mm/yyyy" inputmode="numeric" maxlength="10" oninput="autoSlash(this)">

    <label id="lTob">जन्म समय (TOB)</label>
    <input type="time" id="tob">

    <label id="lBcity">bc</label>
    <select id="birthCity" onchange="toggleBOther()"></select>
    <div id="bOtherBox" class="hidden" style="margin-top:8px;"><div class="row2"><div><input type="text" id="bLat" inputmode="decimal"></div><div><input type="text" id="bLon" inputmode="decimal"></div></div>
      <label id="lTz">tz</label>
      <select id="birthTz"><option value="-8">UTC-8:00</option><option value="-7">UTC-7:00</option><option value="-6">UTC-6:00</option><option value="-5">UTC-5:00</option><option value="-4">UTC-4:00</option><option value="0">UTC+0:00</option><option value="1">UTC+1:00</option><option value="2">UTC+2:00</option><option value="3">UTC+3:00</option><option value="4">UTC+4:00</option><option value="5">UTC+5:00</option><option value="5.5">UTC+5:30 (India)</option><option value="5.75">UTC+5:45</option><option value="6">UTC+6:00</option><option value="7">UTC+7:00</option><option value="8">UTC+8:00</option><option value="9">UTC+9:00</option><option value="10">UTC+10:00</option></select></div>
    <label style="font-weight:400;font-size:.85rem;"><input type="checkbox" id="birthDst"> <span id="tDst"></span></label>

    <label id="lTargetDate">किस तारीख को शुभ मुहूर्त देखना है?</label>
    <input type="text" id="targetDate" placeholder="dd/mm/yyyy" inputmode="numeric" maxlength="10" oninput="autoSlash(this)">

    <label id="lKary">कार्य (किस कार्य हेतु मुहूर्त देखना है)</label>
    <select id="kary" onchange="toggleAnyaKary()"></select>
    <input type="text" id="karyAnya" class="hidden" style="margin-top:8px;">

    <label id="lCity">city</label>
    <select id="workCity" onchange="toggleOther()"></select>
    <div id="otherBox" class="hidden" style="margin-top:8px;"><div class="row2"><div><input type="text" id="wLat" inputmode="decimal"></div><div><input type="text" id="wLon" inputmode="decimal"></div></div><input type="text" id="wTz" inputmode="decimal" value="5.5" style="margin-top:8px;"></div>

    <button class="primary" id="btnCalc" onclick="calculate()">मुहूर्त, रंग व उपाय देखें</button>
    <button class="secondary" id="btnReset" onclick="resetForm()">रीसेट करें</button>
  </div>

  <div id="output" class="hidden"></div>

  <div class="note" style="text-align:center;" id="tNote">
    * गणना सूर्योदय 6:00 व सूर्यास्त 18:00 (भारतीय मानक समय) मान कर की गई है — जन्म स्थान की गणना भी IST आधार पर है।
  </div>
</div>

/* ---- Fortuna Point core (from the Fortuna app) ---- */
const D2R = Math.PI / 180;
const R2D = 180 / Math.PI;
const norm360 = d => { d = d % 360; return d < 0 ? d + 360 : d; };

function julianDay(y, m, d, hourUT) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  const jd0 = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  return jd0 + hourUT / 24;
}

function sunLongitude(T) {
  const L0 = norm360(280.46646 + 36000.76983 * T + 0.0003032 * T * T);
  const M = norm360(357.52911 + 35999.05029 * T - 0.0001537 * T * T);
  const Mr = M * D2R;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
          + 0.000289 * Math.sin(3 * Mr);
  const trueLong = L0 + C;
  const omega = 125.04 - 1934.136 * T;
  const apparent = trueLong - 0.00569 - 0.00478 * Math.sin(omega * D2R);
  return norm360(apparent);
}

function obliquity(T) {
  return 23.4392911 - 0.0130042 * T - 0.00000016 * T * T + 0.000000504 * T * T * T;
}

function gst(jd) {
  const theta = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
    + 0.000387933 * ((jd - 2451545.0) / 36525) * ((jd - 2451545.0) / 36525);
  return norm360(theta);
}

function ascendant(jd, T, lat, lon) {
  const gstDeg = gst(jd);
  const ramc = norm360(gstDeg + lon);
  const eps = obliquity(T) * D2R;
  const ramcR = ramc * D2R;
  const latR = lat * D2R;
  const y = -Math.cos(ramcR);
  const x = Math.sin(ramcR) * Math.cos(eps) + Math.tan(latR) * Math.sin(eps);
  return norm360(Math.atan2(y, x) * R2D + 180);
}

/* KP New Ayanamsa — calibrated against 5 kpvani.com reference charts

function kpNewAyanamsa(jd) {
  const JD2000 = 2451544.5; // 1 Jan 2000, 00:00 UT
  const base = 24.14934;
  const ratePerYear = 0.0208482;
  const years = (jd - JD2000) / 365.25;
  return base + ratePerYear * years;
}

function subLordChain(startLord, spanArcmin, positionArcmin) {
  const startIdx = NAK_LORD_CYCLE.indexOf(startLord);
  let acc = 0;
  for (let i = 0; i < 9; i++) {
    const lord = NAK_LORD_CYCLE[(startIdx + i) % 9];
    const portion = (DASHA_YEARS[lord] / 120) * spanArcmin;
    if (positionArcmin < acc + portion - 1e-7) {
      return { lord, offsetIntoPortion: positionArcmin - acc, portion };
    }
    acc += portion;
  }
  const lastLord = NAK_LORD_CYCLE[(startIdx + 8) % 9];
  return { lord: lastLord, offsetIntoPortion: 0, portion: (DASHA_YEARS[lastLord] / 120) * spanArcmin };
}

function kpDetail(siderealLong) {
  const lon = norm360(siderealLong);
  const signIdx = Math.floor(lon / 30);
  const degInSign = lon - signIdx * 30;

  const nakSpan = 800;
  const totalArcmin = lon * 60;
  const nakIdx = Math.floor(totalArcmin / nakSpan);
  const posInNak = totalArcmin - nakIdx * nakSpan;
  const nakLord = NAK_LORD_CYCLE[nakIdx % 9];

  const sub = subLordChain(nakLord, nakSpan, posInNak);
  const subSub = subLordChain(sub.lord, sub.portion, sub.offsetIntoPortion);

  const deg = Math.floor(degInSign);
  const minFloat = (degInSign - deg) * 60;
  const min = Math.floor(minFloat);
  const sec = Math.round((minFloat - min) * 60);

  return {
    sign: SIGNS[signIdx],
    signLord: SIGN_LORDS[signIdx],
    degStr: deg + "\u00B0" + String(min).padStart(2, "0") + "'" + String(sec).padStart(2, "0") + '"',
    nakshatra: NAKSHATRAS[nakIdx % 27],
    nakLord,
    subLord: sub.lord,
    subSubLord: subSub.lord
  };
}

function sunTimes(y,m,d,lat,lon,tz){

}
function horaSequenceForDay(weekday){
  const startIdx = CHALDEAN.indexOf(DAY_LORD[weekday]);
  const seq=[]; for(let i=0;i<24;i++) seq.push(CHALDEAN[(startIdx+i)%7]); return seq;
}
function horaLord(h,sr,ss,srNext,seq){
  if(h<sr) h+=24;
  if(h<ss) return seq[Math.min(11,Math.floor((h-sr)/((ss-sr)/12)))];
  return seq[12+Math.min(11,Math.floor((h-ss)/((srNext-ss)/12)))];
}

const NAK_EN=["Ashwini","Bharani","Krittika","Rohini","Mrigashira","Ardra","Punarvasu","Pushya","Ashlesha","Magha","Purva Phalguni","Uttara Phalguni","Hasta","Chitra","Swati","Vishakha","Anuradha","Jyeshtha","Mula","Purva Ashadha","Uttara Ashadha","Shravana","Dhanishtha","Shatabhisha","Purva Bhadrapada","Uttara Bhadrapada","Revati"];
const RASHI_L={hi:["मेष","वृषभ","मिथुन","कर्क","सिंह","कन्या","तुला","वृश्चिक","धनु","मकर","कुम्भ","मीन"],en:["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"]};

function fmtHour(h){
  const tm=((Math.round(h*60)%1440)+1440)%1440, hh=Math.floor(tm/60), mm=tm%60;
  const h12=hh%12===0?12:hh%12; return h12+':'+String(mm).padStart(2,'0')+' '+(hh>=12?'PM':'AM');
}
function calculate(){
  const t=T[LANG];
  const dobP=parseDMY(document.getElementById('dob').value), tobVal=document.getElementById('tob').value, dateP=parseDMY(document.getElementById('targetDate').value);
  const karyVal=document.getElementById('kary').value;
  const karyEntry=KARY_LIST.find(k=>k.v===karyVal)||KARY_LIST[KARY_LIST.length-1];
  let karyDisplay=karyEntry[LANG];
  if(karyVal==='अन्य'){const c=document.getElementById('karyAnya').value.trim(); if(c) karyDisplay=c;}
  if(!dobP||!tobVal){alert(t.alertDob);return;}
  if(!dateP){alert(t.alertDate);return;}
  const btz=(document.getElementById('birthCity').value==='other'?parseFloat(document.getElementById('birthTz').value):5.5)-(document.getElementById('birthDst').checked?1:0);
  let city;
  if(document.getElementById('workCity').value==='other'){
    const la=parseFloat(document.getElementById('wLat').value), lo=parseFloat(document.getElementById('wLon').value), tz=parseFloat(document.getElementById('wTz').value);
    if(!(la>=-66&&la<=66)||!(lo>=-180&&lo<=180)||isNaN(tz)){alert(t.alertLoc);return;}
    city={hi:t.otherCity,en:t.otherCity,lat:la,lon:lo,tz:tz};
  } else { city=Object.assign({tz:5.5},CITIES[document.getElementById('workCity').value]||CITIES[0]); }
  const WTZ=city.tz;
  const [th,tmn]=tobVal.split(':').map(Number);
  const birthDate=new Date(Date.UTC(+dobP.yyyy,+dobP.mm-1,+dobP.dd,th,tmn)-btz*3600000);
  const birthLon=moonSiderealLongitude(birthDate);
  const janmaNakIdx=Math.floor(birthLon/(360/27))%27, janmaRashiIdx=Math.floor(birthLon/30)%12;
  let bLat,bLon; const bc=document.getElementById('birthCity').value;
  if(bc==='other'){bLat=parseFloat(document.getElementById('bLat').value);bLon=parseFloat(document.getElementById('bLon').value);}
  else if(bc!==''&&CITIES[bc]){bLat=CITIES[bc].lat;bLon=CITIES[bc].lon;}
  if(!(bLat>=-66&&bLat<=66)||!(bLon>=-180&&bLon<=180)){alert(t.alertBirthLoc);return;}
  const bJd=birthDate.getTime()/86400000+2440587.5, bT=(bJd-2451545)/36525;
  const fSid=norm360(norm360(ascendant(bJd,bT,bLat,bLon)+moonLongitude(bT)-sunLongitude(bT))-kpNewAyanamsa(bJd));
  const fdet=kpDetail(fSid), fLord=fdet.nakLord;
  const y=+dateP.yyyy,m=+dateP.mm,d=+dateP.dd;
  const weekday=new Date(Date.UTC(y,m-1,d)).getUTCDay();
  const st=sunTimes(y,m,d,city.lat,city.lon,WTZ), rise=st.rise, set=st.set;
  const srNext=sunTimes(y,m,d+1,city.lat,city.lon,WTZ).rise+24;
  const moonAtRise=moonSiderealLongitude(new Date(Date.UTC(y,m-1,d)+(rise-WTZ)*3600000));
  const currentNakIdx=Math.floor(moonAtRise/(360/27))%27;
  const jdL=h=>jdOfLocal(y,m,d,h,WTZ);
  const ascOn=h=>{const jd=jdL(h),Tc=(jd-2451545)/36525;return nakLordOf(norm360(ascendant(jd,Tc,city.lat,city.lon)-kpNewAyanamsa(jd)))===fLord;};
  const moonOn=h=>{const jd=jdL(h),Tc=(jd-2451545)/36525;return nakLordOf(norm360(moonLongitude(Tc)-kpNewAyanamsa(jd)))===fLord;};
  const sjd=jdL(rise), sunLon=norm360(sunLongitude((sjd-2451545)/36525)-kpNewAyanamsa(sjd)), sunOn=nakLordOf(sunLon)===fLord;
  const inDay=w=>w.filter(([a,b])=>b>rise&&a<srNext);
  const ascW=inDay(scanWindows(ascOn,rise-3,srNext+3,1/12)), moonW=inDay(scanWindows(moonOn,rise-30,srNext+30,1/12));
  const ascDisp=ascW.slice(); // same window recurring next morning (~24h later) is shown only once
  if(ascDisp.length>1 && Math.abs((ascDisp[ascDisp.length-1][0]-24)-ascDisp[0][0])<0.5) ascDisp.pop();
  const taraNum=(currentNakIdx-janmaNakIdx+27)%27%9;
  const taraName=TARA_NAMES[LANG][taraNum];
  const taraStatus=taraNum===0?'neutral':([1,3,5,7,8].includes(taraNum)?'good':'bad');

  const daySeq=CHOGHADIYA_DAY[weekday], nightSeq=CHOGHADIYA_NIGHT[weekday], horaSeq=horaSequenceForDay(weekday);
  const d8=(set-rise)/8, n8=(srNext-set)/8, blocks=[];
  const nakAt=h=>Math.floor(moonSiderealLongitude(new Date(Date.UTC(y,m-1,d)+(h-WTZ)*3600000))/(360/27))%27;
  const RAHU=[8,2,7,5,6,4,3][weekday]-1;
  const mk=(startH,len,chog,period,rahu)=>{
    const hora=horaLord(startH+len/2,rise,set,srNext,horaSeq);
    const tn=(nakAt(startH+len/2)-janmaNakIdx+27)%27%9;
    const ts=tn===0?0:([1,3,5,7,8].includes(tn)?1:-2);
    let score=0;
    if(CHOGHADIYA_GOOD.includes(chog)) score+=2; else if(CHOGHADIYA_OK.includes(chog)) score+=1;
    if(karyEntry.fav.includes(hora)) score+=2; else if(!karyEntry.avoid.includes(hora)&&!BAD_HORA.includes(hora)) score+=1;
    score+=ts; if(rahu) score=-9;
    const fa=overlapH(ascW,startH,startH+len)>=1/3, fm=overlapH(moonW,startH,startH+len)>=0.5;
    blocks.push({startH,len,chog,hora,score,fa,fm,fb:(fa?1:0)+(fm?1:0),period,taraName:TARA_NAMES[LANG][tn]});
  };
  for(let i=0;i<8;i++) mk(rise+i*d8,d8,daySeq[i],t.day,i===RAHU);
  for(let i=0;i<8;i++) mk(set+i*n8,n8,nightSeq[i],t.night,false);
  blocks.sort((a,b)=>(b.score+b.fb)-(a.score+a.fb));
  const topBlocks=blocks.filter(b=>b.score>=3).slice(0,4), bestScore=Math.max(...blocks.map(b=>b.score+Math.min(b.fb,1)));

  const janmaTatva=RASHI_TATVA[janmaRashiIdx], gocharTatva=RASHI_TATVA[Math.floor(moonAtRise/30)%12], friendTatva=TATVA_FRIEND[janmaTatva];
  let rangTatva,rangNote;
  if(gocharTatva===janmaTatva){rangTatva=janmaTatva;rangNote=t.rangNote1;}
  else if(gocharTatva===friendTatva){rangTatva=friendTatva;rangNote=t.rangNote2;}
  else{rangTatva=friendTatva;rangNote=t.rangNote3;}
  const colorInfo=TATVA_COLOR[LANG][rangTatva];

  let verdict,vClass;
  if(bestScore>=5){verdict=t.vGreat1;vClass='v-great';}
  else if(bestScore>=4){verdict=t.vGreat2;vClass='v-great';}
  else if(bestScore<=2){verdict=t.vBad;vClass='v-bad';}
  else{verdict=t.vOk;vClass='v-ok';}

  const lord=NAK_LORDS[currentNakIdx%9];
  const upayText=(vClass!=='v-great'?t.upayBad(GRAH_MANTRA[lord],colorInfo.name):t.upayOk(colorInfo.name))+t.closing;
  const nkName=i=>LANG==='hi'?NAK[i]:NAK_EN[i];
  let chg=[], prev=currentNakIdx;
  for(let h=rise+0.083; h<srNext; h+=0.083){ const n=nakAt(h); if(n!==prev){ chg.push(nkName(n)+' '+fmtHour(h)); prev=n; } }
  const rk=rise+RAHU*d8;
  const info=`${t.janma}: ${nkName(janmaNakIdx)} / ${RASHI_L[LANG][janmaRashiIdx]}<br>${t.todayNak}: ${nkName(currentNakIdx)}<br>${t.sun}: ${fmtHour(rise)} – ${fmtHour(set)} (${city[LANG]})<br>${t.rahu}: ${fmtHour(rk)} – ${fmtHour(rk+d8)}${chg.length?'<br>'+t.nakChange+': '+chg.join(', '):''}`;
  const dl=h=>h<0?' ('+t.prevD+')':(h>=24?' ('+t.nextD+')':'');
  const lst=w=>w.length?w.map(([a,b])=>fmtHour(a)+dl(a)+' – '+fmtHour(b)+dl(b)).join(', '):'—';
  const frows=[]; ascDisp.forEach(([a,b])=>frows.push([t.fTagAsc,a,b])); moonW.forEach(([a,b])=>frows.push([t.fTagMoon,a,b])); frows.sort((x,y)=>x[1]-y[1]);
  const fhtml=`<div style="margin-top:12px;font-weight:700;font-size:.92rem;color:#1565c0;">⭐ ${t.fTitle}</div>`+
    (frows.length?frows.map(r=>`<div class="slot fort"><span>${fmtHour(r[1])}${dl(r[1])} – ${fmtHour(r[2])}${dl(r[2])}</span><span>⭐ ${r[0]}</span></div>`).join(''):`<div class="slot fort">—</div>`)+
    (sunOn?`<div class="slot fort"><span>${t.fSun}</span><span>${t.fSunYes}</span></div>`:'');
  
  const tp=[]; for(let h=rise;h<srNext;h+=1/60){const tn=(nakAt(h)-janmaNakIdx+27)%27%9; if(!tp.length||tp[tp.length-1].tn!==tn) tp.push({tn,s:h,e:h+1/60}); else tp[tp.length-1].e=h+1/60;}
  tp[tp.length-1].e=srNext;
  const tst=tn=>tn===0?'neutral':([1,3,5,7,8].includes(tn)?'good':'bad');
  const sfx={good:t.shubh,bad:t.ashubh,neutral:t.samanya};
  let taraHtml=tp.map(p=>{const st2=tst(p.tn);return `<div class="slot ${st2==='good'?'best':(st2==='bad'?'bad':'ok')}"><span>${fmtHour(p.s)}${dl(p.s)} – ${fmtHour(p.e)}${dl(p.e)}</span><span>${TARA_NAMES[LANG][p.tn]} ${sfx[st2]}</span></div>`;}).join('');
  const gp=tp.find(p=>tst(p.tn)==='good'), anyBad=tp.some(p=>tst(p.tn)==='bad');
  let tnote='';
  if(!gp) tnote=anyBad&&tp.every(p=>tst(p.tn)==='bad')?t.tAllBad:'';
  else if(!anyBad&&tp.every(p=>tst(p.tn)==='good')) tnote=t.tAllGood;
  else if(anyBad) tnote=(gp.s<=rise+0.02)?t.tBefore(fmtHour(gp.e)+dl(gp.e)):t.tAfter(fmtHour(gp.s)+dl(gp.s),TARA_NAMES[LANG][gp.tn]);
  if(tnote) taraHtml+=`<div class="upay-box" style="margin-top:8px;">${tnote}</div>`;
  renderOutput({verdict,vClass,taraName,taraStatus,topBlocks,fmtHour,colorInfo,rangNote,upayText,karyDisplay,info,fhtml,taraHtml});
}

function renderOutput({verdict, vClass, taraName, taraStatus, topBlocks, fmtHour, colorInfo, rangNote, upayText, karyDisplay, info, fhtml, taraHtml}){
  const t = T[LANG];
  const cls = taraStatus==='good'?'tara-good':(taraStatus==='bad'?'tara-bad':'tara-neutral');
  const taraSuffix = taraStatus==='good'?t.shubh:(taraStatus==='bad'?t.ashubh:t.samanya);
  let slotsHtml = topBlocks.map((b,i)=>{
    const end = b.startH+b.len;
    const horaLabel = LANG==='hi' ? b.hora : GRAH_EN[b.hora];
    const chogLabel = LANG==='hi' ? b.chog : CHOGHADIYA_EN[b.chog];
    return `<div class="slot ${i<2?'best':'ok'}"><span>${fmtHour(b.startH)} – ${fmtHour(end)} (${b.period})</span><span>${chogLabel} · ${horaLabel} ${t.hora} · ${b.taraName}${b.fa?' · ⭐'+t.fTagAsc:''}${b.fm?' · ⭐'+t.fTagMoon:''}</span></div>`;
  }).join('');
  if(!slotsHtml) slotsHtml = `<div class="slot ok">${t.noSlot}</div>`;

  const html = `
  <div class="card verdict-card">
    <div class="ganesh">${t.ganesh}</div>
    <div class="note" style="margin-top:6px;">${t.karyLabel} ${karyDisplay}</div>
    <div class="verdict-badge ${vClass}">${verdict}</div>
    <div class="verdict-sub">${t.verdictSub}</div>
  </div>
  <div class="card">
    <div class="result-title">${t.taraTitle}</div>
    ${taraHtml}
  </div>
  <div class="card">
    <div class="result-title">${t.timeTitle}</div>
    ${slotsHtml}
    ${fhtml}
  </div>
  <div class="card">
    <div class="result-title">${t.rangTitle}</div>
    <div class="swatch-row"><div class="swatch" style="background:${colorInfo.hex}"></div><div><b>${colorInfo.name}</b></div></div>
    <div class="note">${rangNote}</div>
  </div>
  <div class="card">
    <div class="result-title">${t.upayTitle}</div>
    <div class="upay-box">${upayText}</div>
  </div>
  <div class="card"><div class="result-title">${t.infoTitle}</div><div class="note" style="font-size:.85rem;line-height:1.7;">${info}</div></div>
  <div class="disclaimer">${t.disclaimer}</div>
  `;
  const out = document.getElementById('output');
  out.innerHTML = html;
  out.classList.remove('hidden');
  out.scrollIntoView({behavior:'smooth', block:'start'});
}
