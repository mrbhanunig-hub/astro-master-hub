<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>स्वयं को जानें | Know Yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<style>
  :root{
    --bg:#12132a;
    --bg-soft:#181a3a;
    --panel:#1c1e44;
    --panel-2:#20234e;
    --gold:#d4a54c;
    --gold-soft:#e8c682;
    --violet:#9b87d9;
    --text:#f2efe6;
    --muted:#a3a1c9;
    --line:rgba(212,165,76,0.22);
    --danger:#e08a8a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 80% 8%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 30%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 90% 70%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,.3), transparent),
      linear-gradient(180deg, #0f1026 0%, #12132a 40%, #171a3d 100%);
    background-attachment: fixed;
    color:var(--text);
    font-family:'Noto Sans Devanagari','Noto Sans',sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Tiro Devanagari Hindi',serif;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}

  .langbar{display:flex;justify-content:center;gap:8px;margin-bottom:22px;}
  .langbtn{
    background:transparent;border:1px solid rgba(163,161,201,.35);color:var(--muted);
    padding:7px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;font-family:inherit;
  }
  .langbtn.active{background:var(--gold);color:#231a08;border-color:var(--gold);font-weight:600;}

  header{text-align:center;margin-bottom:36px;}
  header .eyebrow{color:var(--violet);font-size:.95rem;letter-spacing:.02em;margin-bottom:6px;}
  header h1{font-size:2.4rem;margin:0 0 8px;color:var(--gold-soft);font-weight:400;}
  header p{color:var(--muted);max-width:480px;margin:0 auto;font-size:.98rem;}
  .divider{width:64px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 0;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px 26px;
    margin-bottom:22px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:24px; right:24px; height:2px;
    background:linear-gradient(90deg, var(--gold), transparent 70%);
  }
  .section-title{font-size:1.15rem;color:var(--gold-soft);margin:0 0 18px;font-weight:400;}

  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;}
  .field{margin-bottom:18px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  select,input[type=text],input[type=number]{
    width:100%;
    background:var(--bg-soft);
    border:1px solid rgba(163,161,201,0.25);
    color:var(--text);
    padding:11px 10px;
    border-radius:4px;
    font-family:inherit;
    font-size:.95rem;
    appearance:none;
    -webkit-appearance:none;
  }
  select:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .hint{font-size:.78rem;color:var(--muted);margin-top:6px;}
  #manualFields{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed rgba(163,161,201,0.25);}

  .btnrow{display:flex;gap:12px;margin-top:8px;}
  button.action{
    font-family:inherit;font-size:1rem;font-weight:600;
    padding:13px 20px;border-radius:4px;border:none;cursor:pointer;
    flex:1;
  }
  #calcBtn{background:var(--gold);color:#231a08;}
  #calcBtn:hover{background:var(--gold-soft);}
  #resetBtn{background:transparent;color:var(--muted);border:1px solid rgba(163,161,201,0.35);}
  #resetBtn:hover{color:var(--text);border-color:var(--text);}

  .error{color:var(--danger);font-size:.88rem;margin-top:10px;display:none;}

  #result{display:none;}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
  .summary-box{background:var(--panel-2);border-radius:5px;padding:16px;text-align:center;border:1px solid var(--line);}
  .summary-box .label{font-size:.78rem;color:var(--muted);margin-bottom:6px;}
  .summary-box .value{font-size:1.3rem;color:var(--gold-soft);font-family:'Tiro Devanagari Hindi',serif;}
  .summary-box .sub{font-size:.78rem;color:var(--violet);margin-top:3px;}

  .detail-block h3{font-size:1.05rem;color:var(--gold-soft);margin:0 0 4px;font-weight:400;}
  .detail-block .meta{font-size:.82rem;color:var(--violet);margin-bottom:10px;}
  .detail-block p{color:var(--text);margin:0;font-size:.96rem;}

  footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:30px;}
  @media(max-width:480px){
    .row3{grid-template-columns:1fr 1fr;}
    .summary-grid{grid-template-columns:1fr;}
    header h1{font-size:1.9rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <button class="langbtn" id="btnHi">हिंदी</button>
    <button class="langbtn" id="btnEn">English</button>
  </div>

  <header>
    <div class="eyebrow" id="txtEyebrow"></div>
    <h1 id="txtTitle"></h1>
    <p id="txtIntro"></p>
    <div class="divider"></div>
  </header>

  <!-- Attached id="birthDetailsCard" for Saved Profile Selector -->
  <div class="card" id="birthDetailsCard">
    <h2 class="section-title" id="txtBirthDetails"></h2>

    <div class="field">
      <label id="lblName"></label>
      <input type="text" id="nameInput">
    </div>

    <div class="field">
      <label id="lblDob"></label>
      <div class="row3">
        <select id="dobDay"></select>
        <select id="dobMonth"></select>
        <select id="dobYear"></select>
      </div>
    </div>

    <div class="field">
      <label id="lblTob"></label>
      <div class="row3">
        <select id="tobHour"></select>
        <select id="tobMin"></select>
        <select id="tobAmpm"><option value="AM">AM</option><option value="PM">PM</option></select>
      </div>
    </div>

    <div class="field">
      <label id="lblPob"></label>
      <div class="row2" style="margin-bottom:10px;">
        <select id="pobCountry"></select>
        <select id="pobState"></select>
      </div>
      <select id="pobCity"></select>
      <div class="hint" id="txtPlaceHint"></div>
    </div>

    <div id="manualFields">
      <div class="row3">
        <div>
          <label id="lblLat"></label>
          <input type="number" id="manLat" step="0.0001" placeholder="26.4499">
        </div>
        <div>
          <label id="lblLon"></label>
          <input type="number" id="manLon" step="0.0001" placeholder="80.3319">
        </div>
        <div>
          <label id="lblUtc"></label>
          <input type="number" id="manUtc" step="0.25" placeholder="5.5">
        </div>
      </div>
    </div>

    <div class="error" id="errorMsg"></div>

    <div class="btnrow">
      <button class="action" id="calcBtn"></button>
      <button class="action" id="resetBtn"></button>
    </div>
  </div>

  <div id="result">
    <div class="card">
      <h2 class="section-title" id="resultHeading"></h2>
      <div class="summary-grid">
        <div class="summary-box"><div class="label" id="lblBoxRashi"></div><div class="value" id="sumRashi">-</div><div class="sub" id="sumRashiSub"></div></div>
        <div class="summary-box"><div class="label" id="lblBoxNak"></div><div class="value" id="sumNak">-</div><div class="sub" id="sumNakSub"></div></div>
        <div class="summary-box"><div class="label" id="lblBoxMool"></div><div class="value" id="sumMool">-</div><div class="sub" id="sumMoolSub"></div></div>
        <div class="summary-box"><div class="label" id="lblBoxBhagya"></div><div class="value" id="sumBhagya">-</div><div class="sub" id="sumBhagyaSub"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="detail-block">
        <h3 id="hRashi"></h3>
        <div class="meta" id="rashiMeta"></div>
        <p id="rashiDesc"></p>
      </div>
    </div>

    <div class="card">
      <div class="detail-block">
        <h3 id="hNak"></h3>
        <div class="meta" id="nakMeta"></div>
        <p id="nakDesc"></p>
      </div>
    </div>

    <div class="card">
      <div class="detail-block">
        <h3 id="hMool"></h3>
        <div class="meta" id="moolMeta"></div>
        <p id="moolDesc"></p>
      </div>
    </div>

    <div class="card">
      <div class="detail-block">
        <h3 id="hBhagya"></h3>
        <div class="meta" id="bhagyaMeta"></div>
        <p id="bhagyaDesc"></p>
      </div>
    </div>
  </div>

  <footer id="txtFooter"></footer>
</div>

<script>
/* ============ UI STRINGS ============ */
const STRINGS = {
  hi:{
    eyebrow:"वैदिक ज्योतिष एवं अंक ज्योतिष",

    latLabel:"अक्षांश (Latitude)", lonLabel:"देशांतर (Longitude)", utcLabel:"UTC ऑफसेट (घंटे)",

    errPlace:"कृपया जन्म स्थान की पूरी जानकारी भरें।",

    metaRashi:(l,e,s)=>`स्वामी ग्रह: ${l} · तत्व: ${e} · प्रतीक: ${s}`,
    metaNak:(l,d,s,p)=>`स्वामी ग्रह: ${l} · देवता: ${d} · प्रतीक: ${s} · चरण: ${p}`,

    metaBhagya:(n,l)=>`भाग्यांक ${n} · स्वामी ग्रह: ${l}`,

  },
  en:{

    title:"Know Yourself",
    intro:"Enter your date of birth, time of birth and place of birth — discover your personality in detail according to your Rashi, Nakshatra, Moolank and Bhagyank.",
    birthDetails:"Birth Details",
    nameLabel:"Name (optional)", namePlaceholder:"Enter your name",
    dobLabel:"Date of Birth",

    placeHint:'For countries outside India, standard time is used — daylight saving time is not included. Choose "Other / Manual" for precision.',

    hMool:"According to your Moolank (Numerology)", hBhagya:"According to your Bhagyank (Numerology)",
    metaRashi:(l,e,s)=>`Ruling planet: ${l} · Element: ${e} · Symbol: ${s}`,
    metaNak:(l,d,s,p)=>`Ruling planet: ${l} · Deity: ${d} · Symbol: ${s} · Pada: ${p}`,

  }
};
let currentLang = 'hi';

/* ============ RASHI / NAKSHATRA / ANK DATA (bilingual) ============ */
const RASHI = [
 {name:{hi:"मेष",en:"Aries"}, lord:{hi:"मंगल",en:"Mars"}, element:{hi:"अग्नि",en:"Fire"}, symbol:{hi:"मेढ़ा",en:"Ram"},
  desc:{hi:"मेष राशि के जातक ऊर्जावान, साहसी और नेतृत्व करने वाले होते हैं। मंगल के प्रभाव से इनमें आत्मविश्वास और तेज़ निर्णय लेने की क्षमता होती है। ये नई शुरुआत करने में माहिर होते हैं, पर जल्दबाज़ी और गुस्सा इनकी कमजोरी बन सकती है। करियर में ये सेना, खेल, उद्यमिता व नेतृत्व की भूमिकाओं में सफल होते हैं। रिश्तों में ये सीधे व स्पष्टवादी होते हैं, पर धैर्य रखना सीखना इनके लिए लाभदायक रहेगा।",
      en:"Aries natives are energetic, courageous and natural leaders. Mars gives them confidence and the ability to make quick decisions. They excel at starting new things, though haste and a short temper can be their weakness. They find success in the military, sports, entrepreneurship and leadership roles. In relationships they are direct and straightforward, though learning patience will serve them well."}},
 {name:{hi:"वृषभ",en:"Taurus"}, lord:{hi:"शुक्र",en:"Venus"}, element:{hi:"पृथ्वी",en:"Earth"}, symbol:{hi:"बैल",en:"Bull"},
  desc:{hi:"वृषभ राशि के जातक स्थिर, धैर्यवान और भौतिक सुख-सुविधाओं को महत्व देने वाले होते हैं। शुक्र के प्रभाव से इनमें सौंदर्यबोध, कला-प्रेम और आरामतलबी स्वभाव पाया जाता है। ये भरोसेमंद व मेहनती होते हैं, पर ज़िद्दी और बदलाव से बचने वाले भी हो सकते हैं। वित्त, बैंकिंग, कला व खाद्य उद्योग में सफलता मिलती है। रिश्तों में वफादार पर मालिकाना भावना रखने वाले होते हैं।",
      en:"Taurus natives are stable, patient and value material comfort. Venus gives them an eye for beauty, a love of art and a relaxed nature. They are reliable and hardworking, though they can also be stubborn and resistant to change. They find success in finance, banking, the arts and the food industry. In relationships they are loyal but can be possessive."}},
 {name:{hi:"मिथुन",en:"Gemini"}, lord:{hi:"बुध",en:"Mercury"}, element:{hi:"वायु",en:"Air"}, symbol:{hi:"युगल",en:"Twins"},
  desc:{hi:"मिथुन राशि के जातक बुद्धिमान, वाक्पटु और जिज्ञासु स्वभाव के होते हैं। बुध के प्रभाव से इनमें संचार कौशल, तर्कशक्ति और सीखने की गहरी रुचि होती है। ये बहुमुखी प्रतिभा के धनी होते हैं पर एकाग्रता व स्थिरता की कमी हो सकती है। मीडिया, लेखन, शिक्षण व बिक्री जैसे क्षेत्रों में सफल होते हैं। रिश्तों में मज़ेदार व दिलचस्प साथी होते हैं, पर भावनात्मक गहराई विकसित करना ज़रूरी है।",

 {name:{hi:"कर्क",en:"Cancer"}, lord:{hi:"चंद्र",en:"Moon"}, element:{hi:"जल",en:"Water"}, symbol:{hi:"केकड़ा",en:"Crab"},
  desc:{hi:"कर्क राशि के जातक भावुक, संवेदनशील और देखभाल करने वाले स्वभाव के होते हैं। चंद्रमा के प्रभाव से इनमें गहरी अंतर्ज्ञान शक्ति, पारिवारिक लगाव और कल्पनाशीलता पाई जाती है। ये अपनों की रक्षा करने में आगे रहते हैं, पर मूड में उतार-चढ़ाव व अतीत से जुड़ाव इनकी चुनौती है। गृह-निर्माण, खानपान, नर्सिंग व मनोविज्ञान क्षेत्र इनके अनुकूल हैं। रिश्तों में वफादार व स्नेही साथी साबित होते हैं।",
      en:"Cancer natives are emotional, sensitive and nurturing by nature. The Moon gives them deep intuition, strong family attachment and vivid imagination. They protect their loved ones fiercely, though mood swings and holding onto the past can be a challenge. Homemaking, food, nursing and psychology suit them well. In relationships they prove to be loyal and affectionate partners."}},
 {name:{hi:"सिंह",en:"Leo"}, lord:{hi:"सूर्य",en:"Sun"}, element:{hi:"अग्नि",en:"Fire"}, symbol:{hi:"सिंह",en:"Lion"},
  desc:{hi:"सिंह राशि के जातक आत्मविश्वासी, दमदार व्यक्तित्व वाले और स्वाभाविक नेता होते हैं। सूर्य के प्रभाव से इनमें गरिमा, रचनात्मकता व उदारता पाई जाती है। ये मंच पर चमकना पसंद करते हैं व सम्मान चाहते हैं, पर अहंकार व अधिकार-भाव इनकी कमजोरी बन सकते हैं। प्रशासन, मनोरंजन, राजनीति व नेतृत्व की भूमिकाओं में सफलता मिलती है। रिश्तों में उदार व वफादार होते हैं, पर सराहना की अपेक्षा रखते हैं।",
      en:"Leo natives are confident, charismatic and natural-born leaders. The Sun gives them dignity, creativity and generosity. They enjoy being in the spotlight and seek respect, though ego and a sense of entitlement can be their weakness. They find success in administration, entertainment, politics and leadership roles. In relationships they are generous and loyal, but expect appreciation in return."}},
 {name:{hi:"कन्या",en:"Virgo"}, lord:{hi:"बुध",en:"Mercury"}, element:{hi:"पृथ्वी",en:"Earth"}, symbol:{hi:"कन्या",en:"Maiden"},
  desc:{hi:"कन्या राशि के जातक विश्लेषणात्मक, व्यवस्थित और पूर्णतावादी स्वभाव के होते हैं। बुध के प्रभाव से इनमें सेवा-भाव, बारीकी पर ध्यान व व्यावहारिक बुद्धि पाई जाती है। ये भरोसेमंद कर्मचारी व सलाहकार होते हैं, पर अत्यधिक आलोचनात्मक व चिंतित स्वभाव इनकी चुनौती है। स्वास्थ्य सेवा, लेखांकन, अनुसंधान व प्रशासन में सफल होते हैं। रिश्तों में समर्पित पर अपेक्षाओं में सटीकता चाहने वाले होते हैं।",
      en:"Virgo natives are analytical, organised and perfectionist by nature. Mercury gives them a service orientation, attention to detail and practical intelligence. They make reliable employees and advisors, though excessive criticism and worry can be their challenge. Healthcare, accounting, research and administration suit them well. In relationships they are devoted but expect precision in what they get back."}},
 {name:{hi:"तुला",en:"Libra"}, lord:{hi:"शुक्र",en:"Venus"}, element:{hi:"वायु",en:"Air"}, symbol:{hi:"तराजू",en:"Scales"},
  desc:{hi:"तुला राशि के जातक संतुलित, न्यायप्रिय व सामाजिक स्वभाव के होते हैं। शुक्र के प्रभाव से इनमें सौंदर्यबोध, कूटनीति व सामंजस्य बिठाने की कला पाई जाती है। ये अच्छे मध्यस्थ व साथी होते हैं, पर निर्णय लेने में हिचकिचाहट इनकी कमजोरी है। कानून, कला, फैशन व जनसंपर्क क्षेत्र इनके अनुकूल हैं। रिश्तों में साझेदारी को प्राथमिकता देते हैं व सामंजस्यपूर्ण जीवन चाहते हैं।",
      en:"Libra natives are balanced, fair-minded and social by nature. Venus gives them an eye for beauty, diplomacy and the art of creating harmony. They make good mediators and partners, though indecisiveness can be their weakness. Law, art, fashion and public relations suit them well. In relationships they prioritise partnership and seek a harmonious life."}},
 {name:{hi:"वृश्चिक",en:"Scorpio"}, lord:{hi:"मंगल",en:"Mars"}, element:{hi:"जल",en:"Water"}, symbol:{hi:"बिच्छू",en:"Scorpion"},
  desc:{hi:"वृश्चिक राशि के जातक तीव्र, रहस्यमयी व दृढ़ इच्छाशक्ति वाले होते हैं। मंगल के प्रभाव से इनमें गहन भावनाएँ, अनुसंधान की प्रवृत्ति व परिवर्तनकारी ऊर्जा पाई जाती है। ये वफादार व साहसी होते हैं, पर शक और बदले की भावना इनकी चुनौती बन सकती है। शोध, मनोविज्ञान, चिकित्सा व गुप्तचर कार्यों में सफल होते हैं। रिश्तों में गहरी आत्मीयता व वफादारी चाहते हैं।",
      en:"Scorpio natives are intense, mysterious and strong-willed. Mars gives them deep emotions, a research-oriented mind and transformative energy. They are loyal and courageous, though suspicion and a vengeful streak can be their challenge. Research, psychology, medicine and investigative work suit them well. In relationships they seek deep intimacy and loyalty."}},
 {name:{hi:"धनु",en:"Sagittarius"}, lord:{hi:"गुरु",en:"Jupiter"}, element:{hi:"अग्नि",en:"Fire"}, symbol:{hi:"धनुष",en:"Bow"},
  desc:{hi:"धनु राशि के जातक आशावादी, स्वतंत्रताप्रिय व दार्शनिक सोच वाले होते हैं। गुरु के प्रभाव से इनमें ज्ञान की प्यास, यात्रा-प्रेम व सत्यनिष्ठा पाई जाती है। ये उत्साही व प्रेरणादायक होते हैं, पर अधीरता व अति-स्पष्टवादिता इनकी कमजोरी है। शिक्षा, यात्रा, कानून व धर्म से जुड़े क्षेत्रों में सफलता मिलती है। रिश्तों में स्वतंत्रता व ईमानदारी को महत्व देते हैं।",
      en:"Sagittarius natives are optimistic, freedom-loving and philosophical by nature. Jupiter gives them a thirst for knowledge, a love of travel and honesty. They are enthusiastic and inspiring, though impatience and excessive bluntness can be their weakness. Education, travel, law and religious fields suit them well. In relationships they value freedom and honesty."}},
 {name:{hi:"मकर",en:"Capricorn"}, lord:{hi:"शनि",en:"Saturn"}, element:{hi:"पृथ्वी",en:"Earth"}, symbol:{hi:"मगरमच्छ",en:"Sea-goat"},
  desc:{hi:"मकर राशि के जातक अनुशासित, महत्वाकांक्षी व यथार्थवादी होते हैं। शनि के प्रभाव से इनमें धैर्य, ज़िम्मेदारी व दीर्घकालिक सोच पाई जाती है। ये कड़ी मेहनत से लक्ष्य प्राप्त करते हैं, पर अत्यधिक गंभीरता व निराशावाद इनकी चुनौती है। प्रबंधन, इंजीनियरिंग, राजनीति व वित्त क्षेत्र इनके अनुकूल हैं। रिश्तों में स्थिरता व प्रतिबद्धता को महत्व देते हैं।",
      en:"Capricorn natives are disciplined, ambitious and realistic. Saturn gives them patience, a sense of responsibility and long-term thinking. They achieve their goals through hard work, though excessive seriousness and pessimism can be their challenge. Management, engineering, politics and finance suit them well. In relationships they value stability and commitment."}},
 {name:{hi:"कुंभ",en:"Aquarius"}, lord:{hi:"शनि",en:"Saturn"}, element:{hi:"वायु",en:"Air"}, symbol:{hi:"घड़ा",en:"Water-bearer"},
  desc:{hi:"कुंभ राशि के जातक नवाचारी, स्वतंत्र सोच वाले व मानवतावादी होते हैं। शनि के प्रभाव से इनमें मौलिकता, सामाजिक चेतना व बुद्धिमत्ता पाई जाती है। ये भविष्यदृष्टा व अलग सोचने वाले होते हैं, पर भावनात्मक दूरी व ज़िद इनकी कमजोरी बन सकती है। विज्ञान, तकनीक, समाजसेवा व अनुसंधान में सफल होते हैं। रिश्तों में मित्रता को प्राथमिकता देते हैं व स्वतंत्रता चाहते हैं।",
      en:"Aquarius natives are innovative, independent-minded and humanitarian. Saturn gives them originality, social awareness and intelligence. They are visionary and think differently, though emotional distance and stubbornness can be their weakness. Science, technology, social work and research suit them well. In relationships they prioritise friendship and value independence."}},
 {name:{hi:"मीन",en:"Pisces"}, lord:{hi:"गुरु",en:"Jupiter"}, element:{hi:"जल",en:"Water"}, symbol:{hi:"मछली",en:"Fish"},
  desc:{hi:"मीन राशि के जातक कल्पनाशील, करुणामयी व आध्यात्मिक झुकाव वाले होते हैं। गुरु के प्रभाव से इनमें गहरी संवेदनशीलता, रचनात्मकता व सहानुभूति पाई जाती है। ये कलाप्रेमी व सपने देखने वाले होते हैं, पर यथार्थ से पलायन व अनिर्णय इनकी चुनौती है। कला, संगीत, चिकित्सा व आध्यात्मिक क्षेत्रों में सफलता मिलती है। रिश्तों में समर्पित व त्यागी स्वभाव के होते हैं।",
      en:"Pisces natives are imaginative, compassionate and spiritually inclined. Jupiter gives them deep sensitivity, creativity and empathy. They are artistic and dreamy, though escapism and indecision can be their challenge. Art, music, medicine and spiritual fields bring them success. In relationships they are devoted and self-sacrificing."}}

 {name:{hi:"मृगशिरा",en:"Mrigashira"}, lord:{hi:"मंगल",en:"Mars"}, deity:{hi:"चंद्र (सोम)",en:"Soma"}, symbol:{hi:"हिरण का सिर",en:"Deer's head"},

 {name:{hi:"आर्द्रा",en:"Ardra"}, lord:{hi:"राहु",en:"Rahu"}, deity:{hi:"रुद्र",en:"Rudra"}, symbol:{hi:"आँसू / रत्न",en:"Teardrop / Gem"},

 {name:{hi:"पुनर्वसु",en:"Punarvasu"}, lord:{hi:"गुरु",en:"Jupiter"}, deity:{hi:"अदिति",en:"Aditi"}, symbol:{hi:"तरकश",en:"Quiver"},

 {name:{hi:"पुष्य",en:"Pushya"}, lord:{hi:"शनि",en:"Saturn"}, deity:{hi:"बृहस्पति",en:"Brihaspati"}, symbol:{hi:"फूल / थन",en:"Flower / Udder"},

 {name:{hi:"उत्तरा फाल्गुनी",en:"Uttara Phalguni"}, lord:{hi:"सूर्य",en:"Sun"}, deity:{hi:"अर्यमा",en:"Aryaman"}, symbol:{hi:"पलंग का पिछला पैर",en:"Back legs of a bed"},

/* ============ DOM helpers ============ */
const $ = id => document.getElementById(id);
function fillSelect(sel, items, keepValue){
  const prev = keepValue ? sel.value : null;
  sel.innerHTML = items.map(v=>`<option value="${v.value}">${v.label}</option>`).join('');
  if(prev){ sel.value = prev; }
}

function initDateTime(keep){
  const dayItems = Array.from({length:31},(_,i)=>({value:i+1,label:String(i+1).padStart(2,'0')}));
  fillSelect($('dobDay'), dayItems, keep);
  const months = STRINGS[currentLang].months;
  fillSelect($('dobMonth'), months.map((m,i)=>({value:i+1,label:m})), keep);
  if(!keep){
    const yNow = new Date().getFullYear();
    fillSelect($('dobYear'), Array.from({length:120},(_,i)=>yNow-i).map(y=>({value:y,label:y})));
    fillSelect($('tobHour'), Array.from({length:12},(_,i)=>({value:i+1,label:String(i+1).padStart(2,'0')})));
    fillSelect($('tobMin'), Array.from({length:60},(_,i)=>({value:i,label:String(i).padStart(2,'0')})));
  }
}

function placeLabel(hi, en){ return hi + " / " + en; }

function initPlace(){
  const countries = [{value:"भारत",label:placeLabel("भारत","India")}]
    .concat(Object.keys(OTHER_COUNTRIES).map(c=>({value:c,label:placeLabel(c, OTHER_COUNTRIES[c].en)})))
    .concat([{value:"__manual__",label:currentLang==='hi' ? "अन्य / मैन्युअल (Manual)" : "Other / Manual"}]);
  fillSelect($('pobCountry'), countries);
  updateStateOptions();
  $('pobCountry').addEventListener('change', ()=>{updateStateOptions(); updateCityOptions();});$('pobState').addEventListener('change', updateCityOptions);
}

function updateStateOptions(){
  const country = $('pobCountry').value;
  const stateSel = $('pobState');
  if(country === "__manual__"){
    stateSel.style.display='none';
    $('manualFields').style.display='block';
    fillSelect($('pobCity'), [{value:"",label:"—"}]);
    $('pobCity').style.display='none';
    return;
  }
  $('manualFields').style.display='none';
  if(country === "भारत"){
    stateSel.style.display='';
    $('pobCity').style.display='';
    fillSelect(stateSel, Object.keys(INDIA_STATES).map(s=>({value:s,label:placeLabel(s, INDIA_STATES[s].en)})));
  } else {
    stateSel.style.display='none';
    $('pobCity').style.display='';
  }
}

function updateCityOptions(){
  const country = $('pobCountry').value;
  if(country === "__manual__") return;
  let cities;
  if(country === "भारत"){
    cities = (INDIA_STATES[$('pobState').value] || {}).cities || [];
  } else {
    cities = (OTHER_COUNTRIES[country] || {}).cities || [];
  }
  fillSelect($('pobCity'), cities.map(c=>({value:c[0], label:placeLabel(c[0], c[1])})));
}

function getPlaceCoords(){
  const country = $('pobCountry').value;
  if(country === "__manual__"){
    const lat = parseFloat($('manLat').value);
    const lon = parseFloat($('manLon').value);
    const utc = parseFloat($('manUtc').value);
    if(isNaN(lat)||isNaN(lon)||isNaN(utc)) return null;
    return {lat, lon, utc};
  }
  if(country === "भारत"){
    const state = $('pobState').value;
    const cityName = $('pobCity').value;
    const list = (INDIA_STATES[state] || {}).cities || [];
    const c = list.find(x=>x[0]===cityName);
    if(!c) return null;
    return {lat:c[2], lon:c[3], utc:5.5};
  }
  const cityName = $('pobCity').value;
  const list = (OTHER_COUNTRIES[country] || {}).cities || [];
  const c = list.find(x=>x[0]===cityName);
  if(!c) return null;
  return {lat:c[2], lon:c[3], utc:c[4]};
}

/* ============ Astro calculations ============ */
function lahiriAyanamsa(utcDate){
  const j2000 = Date.UTC(2000,0,1,12,0,0);
  const yearsSince2000 = (utcDate.getTime() - j2000) / (365.25*24*3600*1000);
  return 23.8531 + yearsSince2000 * 0.013958;
}

function digitalRoot(n){
  n = Math.abs(Math.trunc(n));
  while(n > 9){
    n = String(n).split('').reduce((a,b)=>a+parseInt(b,10),0);
  }
  return n;
}

function getSiderealMoonLongitude(utcDate){
  const time = Astronomy.MakeTime(utcDate);
  const geoVec = Astronomy.GeoVector(Astronomy.Body.Moon, time, true);
  const ecl = Astronomy.Ecliptic(geoVec);
  const tropicalLon = ecl.elon;
  const ayanamsa = lahiriAyanamsa(utcDate);
  let sidereal = tropicalLon - ayanamsa;
  sidereal = ((sidereal % 360) + 360) % 360;
  return sidereal;
}

function rashiFromLongitude(lon){
  return Math.floor(lon / 30) % 12;
}

function nakshatraFromLongitude(lon){
  const span = 360/27;
  const idx = Math.floor(lon / span) % 27;
  const posInNak = lon % span;
  const pada = Math.floor(posInNak / (span/4)) + 1;
  return {idx, pada};
}

/* ============ Render / control ============ */
function showError(msg){
  const e = $('errorMsg');
  e.textContent = msg;
  e.style.display = msg ? 'block' : 'none';
}

let lastResult = null;

function calculate(){
  showError('');
  const day = parseInt($('dobDay').value,10);
  const month = parseInt($('dobMonth').value,10);
  const year = parseInt($('dobYear').value,10);
  let hour = parseInt($('tobHour').value,10);
  const minute = parseInt($('tobMin').value,10);
  const ampm = $('tobAmpm').value;

  if(ampm === 'AM'){ if(hour===12) hour=0; } else { if(hour!==12) hour+=12; }

  const place = getPlaceCoords();
  if(!place){
    showError(STRINGS[currentLang].errPlace);
    return;
  }

  const utcMillis = Date.UTC(year, month-1, day, hour, minute, 0) - place.utc*3600000;
  const utcDate = new Date(utcMillis);

  if(isNaN(utcDate.getTime())){
    showError(STRINGS[currentLang].errDate);
    return;
  }

  const siderealLon = getSiderealMoonLongitude(utcDate);
  const rashiIdx = rashiFromLongitude(siderealLon);
  const {idx: nakIdx, pada} = nakshatraFromLongitude(siderealLon);

  const moolank = digitalRoot(day);
  const allDigits = (String(day)+String(month)+String(year)).split('').reduce((a,b)=>a+parseInt(b,10),0);
  const bhagyank = digitalRoot(allDigits);

  lastResult = {rashiIdx, nakIdx, pada, moolank, bhagyank};
  renderResult();
}

function renderResult(){
  if(!lastResult) return;
  const {rashiIdx, nakIdx, pada, moolank, bhagyank} = lastResult;
  const S = STRINGS[currentLang];
  const name = $('nameInput').value.trim();$('resultHeading').textContent = name ? S.resultHeadingName(name) : S.resultHeading;

  const r = RASHI[rashiIdx];
  const n = NAKSHATRA[nakIdx];
  const m = ANK[moolank];
  const b = ANK[bhagyank];

  $('sumRashi').textContent = r.name[currentLang];$('sumRashiSub').textContent = S.lordPrefix + r.lord[currentLang];
  $('sumNak').textContent = n.name[currentLang];$('sumNakSub').textContent = S.padaPrefix + pada;
  $('sumMool').textContent = moolank;
  $('sumMoolSub').textContent = m.planet[currentLang];$('sumBhagya').textContent = bhagyank;
  $('sumBhagyaSub').textContent = b.planet[currentLang];

  $('rashiMeta').textContent = S.metaRashi(r.lord[currentLang], r.element[currentLang], r.symbol[currentLang]);$('rashiDesc').textContent = r.desc[currentLang];

  $('nakMeta').textContent = S.metaNak(n.lord[currentLang], n.deity[currentLang], n.symbol[currentLang], pada);$('nakDesc').textContent = n.desc[currentLang];

  $('moolMeta').textContent = S.metaMool(moolank, m.planet[currentLang]);$('moolDesc').textContent = m.desc[currentLang];

  $('bhagyaMeta').textContent = S.metaBhagya(bhagyank, b.planet[currentLang]);$('bhagyaDesc').textContent = b.desc[currentLang];

  $('result').style.display = 'block';
}

function applyStaticText(){
  const S = STRINGS[currentLang];
  document.documentElement.lang = currentLang;
  $('txtEyebrow').textContent = S.eyebrow;
  $('txtTitle').textContent = S.title;
  $('txtIntro').textContent = S.intro;
  $('txtBirthDetails').textContent = S.birthDetails;
  $('lblName').textContent = S.nameLabel;
  $('nameInput').placeholder = S.namePlaceholder;
  $('lblDob').textContent = S.dobLabel;
  $('lblTob').textContent = S.tobLabel;
  $('lblPob').textContent = S.pobLabel;
  $('txtPlaceHint').textContent = S.placeHint;
  $('lblLat').textContent = S.latLabel;
  $('lblLon').textContent = S.lonLabel;
  $('lblUtc').textContent = S.utcLabel;
  $('calcBtn').textContent = S.calcBtn;
  $('resetBtn').textContent = S.resetBtn;
  $('hRashi').textContent = S.hRashi;
  $('hNak').textContent = S.hNak;
  $('hMool').textContent = S.hMool;
  $('hBhagya').textContent = S.hBhagya;
  $('lblBoxRashi').textContent = S.boxRashi;
  $('lblBoxNak').textContent = S.boxNak;
  $('lblBoxMool').textContent = S.boxMool;
  $('lblBoxBhagya').textContent = S.boxBhagya;
  $('txtFooter').textContent = S.footer;
  $('btnHi').classList.toggle('active', currentLang==='hi');$('btnEn').classList.toggle('active', currentLang==='en');
}

function setLang(lang){
  currentLang = lang;
  applyStaticText();
  initDateTime(true);
  initPlace();
  if(lastResult){ renderResult(); }
}

function resetForm(){
  $('nameInput').value = '';
  initDateTime(false);
  initPlace();
  $('manLat').value=''; $('manLon').value='';$('manUtc').value='';
  showError('');
  lastResult = null;
  $('result').style.display = 'none';
}

$('calcBtn').addEventListener('click', calculate);$('resetBtn').addEventListener('click', resetForm);
$('btnHi').addEventListener('click', ()=>setLang('hi'));$('btnEn').addEventListener('click', ()=>setLang('en'));

applyStaticText();
initDateTime(false);
initPlace();
</script>

<script src="birth-profile.js"></script>

<script>
  window.addEventListener("DOMContentLoaded", function () {
    if (window.BirthProfile) {
      // 1. Initialize Profile Engine
      BirthProfile.init();

      // 2. Attach Profile Picker Dropdown at top of the form card
      if (BirthProfile.attachProfileSelector) {
        BirthProfile.attachProfileSelector("birthDetailsCard");
      }

      // 3. Sync from Active Profile on load and calculate
      function syncFromProfile() {
        var p = BirthProfile.get();
        if (p) {
          if (p.name) $('nameInput').value = p.name;
          if (p.day) $('dobDay').value = p.day;
          if (p.month) $('dobMonth').value = p.month;
          if (p.year) $('dobYear').value = p.year;

          if (p.hour !== undefined) {
            var h12 = p.hour % 12 || 12;
            $('tobHour').value = h12;
          }
          if (p.minute !== undefined) {
            $('tobMin').value = p.minute;
          }
          if (p.ampm) {
            $('tobAmpm').value = p.ampm;
          }

          // Trigger manual coords to ensure exact match with profile
          $('pobCountry').value = "__manual__";
          updateStateOptions();
          if (p.lat) $('manLat').value = p.lat;
          if (p.lon) $('manLon').value = p.lon;
          if (p.tz) $('manUtc').value = p.tz || 5.5;

          calculate();
        }
      }

      syncFromProfile();

      // Listen to profile picker changes
      var picker = document.getElementById("cc-app-profile-picker");
      if (picker) {
        picker.addEventListener("change", function () {
          setTimeout(syncFromProfile, 50);
        });
      }
    }
  });
</script>
